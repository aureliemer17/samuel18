<!doctype html>
<html lang="fr" style="touch-action: manipulation">
  <head>
    <meta charset="UTF-8" />

    <!--
      Hauteur du cadre dans le dossier d'archives.

      Repères approximatifs :
      - 140 à 180 : titre, source et 1 à 3 lignes
      - 200 à 260 : titre, source et 4 à 7 lignes
      - 280 à 360 : titre, source et 8 à 12 lignes
      - 360 à 500 : anecdote longue

      Augmenter légèrement si le texte contient un titre, des retours à la ligne
      ou plusieurs paragraphes.
    -->
    <meta name="archive-height" content="200" />

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        color: #322515;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 14px;
        line-height: 1.55;
        margin: 0;
        padding: 16px 18px;
      }

      h2 {
        font-size: 1.2em;
        margin: 0 0 10px;
      }

      .source {
        color: #786d59;
        font-family: "Courier New", monospace;
        font-size: .72em;
        font-weight: bold;
        letter-spacing: .04em;
        margin: -5px 0 14px;
        text-transform: uppercase;
      }

      p {
        margin: 0;
      }

      p + p {
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <h2>Les 18 ans de Samuel</h2>
    <p class="source">Un petit mot d'introduction par sa Maman</p>
    <p>Bravo, vous avez trouvé (par hasard ?) le premier dossier de Samuel. Pas beaucoup plus de choses à rajouter ici alors profitez bien, trouvez les codes pour accéder aux dossiers !</span></p>
</body>
</html>
