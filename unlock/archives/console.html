<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2a0f08" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <style>html { touch-action: manipulation; }</style>
    <title>Archives</title>
    <style>
      :root { --ink: #1b2940; --brass-light: #ffe09a; --brass: #bd7928; --brass-dark: #57300d; --wood-dark: #2a0f08; --wood: #71331d; --paper: #f5edda; }
      * { box-sizing: border-box; }
      body { align-items: center; background: radial-gradient(circle at 50% 15%, #71331d, #2a0f08 62%, #120604); color: var(--paper); display: flex; font-family: Georgia, "Times New Roman", serif; justify-content: center; margin: 0; min-height: 100vh; padding: 18px; }
      main { width: min(100%, 900px); }
      .title { color: #ffe4a5; font-family: ui-monospace, monospace; font-size: clamp(.65rem, 2vw, .9rem); letter-spacing: .22em; margin: 0 0 16px; text-align: center; text-shadow: 0 2px 3px #120604; text-transform: uppercase; }
      .archive-console { background: repeating-linear-gradient(94deg, #3d160c 0 4px, #5f2615 5px 14px, #321008 16px 24px); border: clamp(10px, 2.2vw, 19px) solid #271007; border-radius: 12px; box-shadow: inset 0 0 0 3px #a2542c, inset 0 0 25px #190704, 0 25px 50px rgba(0, 0, 0, .55); padding: clamp(15px, 4vw, 40px); }
      .brass-panel { background: radial-gradient(circle at 32% 20%, #f9ca70, #bd7828 42%, #774012 100%); border: 5px solid var(--brass-light); border-radius: 16px; box-shadow: inset 0 0 0 5px #8c4b17, inset 0 0 33px rgba(60, 25, 2, .42), 0 4px 9px #1b0a03; padding: clamp(36px, 7vw, 70px) clamp(20px, 7vw, 78px) clamp(30px, 6vw, 55px); position: relative; }
      .brass-panel::before { background-image: radial-gradient(rgba(83, 39, 7, .25) 1px, transparent 1px); background-size: 6px 6px; content: ""; inset: 0; pointer-events: none; position: absolute; }
      .screw { background: linear-gradient(135deg, #fff1b0, #916020 58%, #3a2109); border: 2px solid #5d330e; border-radius: 50%; box-shadow: 0 2px 3px rgba(0, 0, 0, .45); height: clamp(17px, 3vw, 26px); position: absolute; width: clamp(17px, 3vw, 26px); z-index: 1; }
      .screw::after { background: #4a290c; content: ""; height: 2px; left: 2px; position: absolute; top: calc(50% - 1px); transform: rotate(-45deg); width: calc(100% - 4px); }
      .screw--tl { left: 18px; top: 18px; } .screw--tr { right: 18px; top: 18px; } .screw--bl { bottom: 18px; left: 18px; } .screw--br { bottom: 18px; right: 18px; }
      .selector { display: grid; gap: clamp(10px, 4vw, 42px); grid-template-columns: repeat(3, minmax(0, 1fr)); position: relative; z-index: 1; }
      .wheel-unit { display: grid; gap: clamp(9px, 2vw, 17px); grid-template-rows: auto 1fr auto; justify-items: center; min-width: 0; }
      .turn { appearance: none; background: linear-gradient(135deg, #fff1a8 0 12%, #d18a2e 42%, #60310b 100%); border: 2px solid #70400f; clip-path: polygon(50% 0, 100% 100%, 0 100%); cursor: pointer; filter: drop-shadow(0 4px 2px rgba(43, 19, 3, .65)); height: clamp(35px, 7vw, 59px); padding: 0; width: clamp(52px, 10vw, 83px); }
      .turn--down { transform: rotate(180deg); }
      .turn:active { filter: drop-shadow(0 1px 1px rgba(43, 19, 3, .65)); transform: translateY(3px); }
      .turn--down:active { transform: rotate(180deg) translateY(3px); }
      .wheel { align-items: center; aspect-ratio: 1; background: linear-gradient(135deg, #ffeaa8, #995418 40%, #edb953 64%, #63330d); border: clamp(4px, 1vw, 8px) solid #70400f; border-radius: 10px; box-shadow: inset 0 0 0 clamp(3px, .7vw, 6px) #f7c966, inset 0 0 20px #3b1705, 0 5px 5px rgba(47, 19, 3, .72); display: flex; justify-content: center; min-width: 0; overflow: hidden; padding: clamp(7px, 2vw, 15px); position: relative; width: 100%; }
      .wheel::before { background: radial-gradient(circle at 34% 23%, #fffdf4, #f5ecdb 58%, #d8c6a9); border: 1px solid #a58653; box-shadow: inset 0 0 18px rgba(73, 42, 11, .16); content: ""; inset: clamp(7px, 1.8vw, 13px); position: absolute; }
      .wheel-value { color: var(--ink); font-family: Georgia, serif; font-size: clamp(2.1rem, 6vw, 4rem); font-weight: 700; line-height: 1; min-width: 0; position: relative; text-align: center; text-shadow: 0 1px 0 #fff; white-space: nowrap; z-index: 1; }
      .wheel-value.rolling-up { animation: roll-up .22s cubic-bezier(.2, .75, .35, 1); }
      .wheel-value.rolling-down { animation: roll-down .22s cubic-bezier(.2, .75, .35, 1); }
      @keyframes roll-up { 0% { opacity: 0; transform: translateY(62%); } 62% { opacity: 1; transform: translateY(-7%); } 100% { opacity: 1; transform: translateY(0); } }
      @keyframes roll-down { 0% { opacity: 0; transform: translateY(-62%); } 62% { opacity: 1; transform: translateY(7%); } 100% { opacity: 1; transform: translateY(0); } }
      .confirm { appearance: none; background: linear-gradient(135deg, #ffe7a0, #c47a24 45%, #84501a 100%); border: clamp(4px, .8vw, 7px) solid #77400e; border-radius: 12px; box-shadow: inset 0 0 0 3px #f7cf73, inset 0 -10px 18px rgba(73, 31, 3, .36), 0 6px 2px #3a1806; color: #211205; cursor: pointer; display: block; font-family: Georgia, serif; font-size: clamp(1.25rem, 4.5vw, 2.7rem); font-weight: 700; margin: clamp(25px, 5vw, 48px) auto 0; padding: clamp(13px, 2.5vw, 22px) clamp(26px, 6vw, 65px); position: relative; text-shadow: 0 1px #ffeac0; z-index: 1; }
      .confirm:active { box-shadow: inset 0 5px 12px rgba(73, 31, 3, .45), 0 2px 1px #3a1806; transform: translateY(4px); }
      .return-link { color: #ffe3a4; display: block; font-family: ui-monospace, monospace; font-size: .7rem; font-weight: 800; letter-spacing: .1em; margin-top: 18px; text-align: center; text-decoration: none; text-transform: uppercase; }
      @media (max-width: 430px) { .archive-console { padding: 11px; } .brass-panel { border-width: 3px; padding: 35px 19px 27px; } .selector { gap: 10px; } .confirm { width: 100%; } .screw--tl { left: 10px; top: 10px; } .screw--tr { right: 10px; top: 10px; } .screw--bl { bottom: 10px; left: 10px; } .screw--br { bottom: 10px; right: 10px; } }
    </style>
  </head>
  <body>
    <main>
      <h1 class="title">Entrepôt documentaire</h1>
      <section class="archive-console" aria-label="Sélecteur de dossier">
        <div class="brass-panel"><span class="screw screw--tl" aria-hidden="true"></span><span class="screw screw--tr" aria-hidden="true"></span><span class="screw screw--bl" aria-hidden="true"></span><span class="screw screw--br" aria-hidden="true"></span>
          <div class="selector">
            <div class="wheel-unit"><button class="turn turn--up" type="button" data-wheel="row" data-step="-1" aria-label="Rangée précédente"></button><div class="wheel"><output class="wheel-value" id="row">I</output></div><button class="turn turn--down" type="button" data-wheel="row" data-step="1" aria-label="Rangée suivante"></button></div>
            <div class="wheel-unit"><button class="turn turn--up" type="button" data-wheel="column" data-step="-1" aria-label="Colonne précédente"></button><div class="wheel"><output class="wheel-value" id="column">A</output></div><button class="turn turn--down" type="button" data-wheel="column" data-step="1" aria-label="Colonne suivante"></button></div>
            <div class="wheel-unit"><button class="turn turn--up" type="button" data-wheel="level" data-step="-1" aria-label="Niveau précédent"></button><div class="wheel"><output class="wheel-value" id="level">1</output></div><button class="turn turn--down" type="button" data-wheel="level" data-step="1" aria-label="Niveau suivant"></button></div>
          </div>
          <button class="confirm" id="confirm" type="button">Consulter le dossier</button>
        </div>
      </section>
      <a class="return-link" href="../jeu/machine.html">Retour aux machines</a>
    </main>
    <script src="../config/archive-config.example.js"></script>
    <script src="../config/archive-config.local.js"></script>
    <script>
      const values = { row: ["I", "II", "III", "IV", "V", "VI", "VII"], column: ["A", "B", "C", "D", "E", "F", "G", "H", "I", "J"], level: ["1", "2", "3", "4", "5", "6", "7", "8"] };
      const position = { row: 0, column: 0, level: 0 };
      const archiveConfig = window.ARCHIVE_CONFIG.media;

       function render(wheel, step) {
         const output = document.querySelector(`#${wheel}`);
         output.classList.remove("rolling-up", "rolling-down");
         output.textContent = values[wheel][position[wheel]];
         if (step) {
           void output.offsetWidth;
           output.classList.add(step < 0 ? "rolling-up" : "rolling-down");
         }
       }
       document.querySelectorAll(".turn").forEach((button) => button.addEventListener("click", () => {
         const wheel = button.dataset.wheel;
         const step = Number(button.dataset.step);
         position[wheel] = (position[wheel] + step + values[wheel].length) % values[wheel].length;
         render(wheel, step);
       }));
      document.querySelector("#confirm").addEventListener("click", () => {
        const code = `${values.row[position.row]}-${values.column[position.column]}-${values.level[position.level]}`;
        window.location.assign(Object.hasOwn(archiveConfig, code) ? `media.html#code=${encodeURIComponent(code)}` : "acces-refuse.html");
      });
    </script>
  </body>
</html>
