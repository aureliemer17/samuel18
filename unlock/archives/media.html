<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dossier d'archive</title>
    <style>
      :root { --ink: #322515; --muted: #776b57; --paper: #f7f0df; --line: #b8a47b; --red: #a33a29; }
      * { box-sizing: border-box; }
      body { background: repeating-linear-gradient(0deg, #2b1b11 0 2px, #382317 2px 7px); color: var(--ink); font-family: "Courier New", Courier, monospace; margin: 0; min-height: 100vh; padding: clamp(18px, 5vw, 52px); }
      main { margin: auto; max-width: 1000px; }
      .folder { background: repeating-linear-gradient(0deg, transparent 0 27px, rgba(97, 70, 36, .09) 28px 29px), var(--paper); box-shadow: 0 25px 52px rgba(0, 0, 0, .55); min-height: 68vh; padding: clamp(26px, 6vw, 66px); position: relative; }
      .folder::before { border: 1px solid #c6b389; content: ""; inset: 13px; pointer-events: none; position: absolute; }
      .folder > * { position: relative; }
      .code { color: var(--red); font-size: .72rem; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; }
      h1 { font-family: Georgia, serif; font-size: clamp(2.2rem, 6vw, 4.6rem); letter-spacing: -.045em; line-height: .95; margin: 10px 0 34px; text-transform: uppercase; }
      .text { background: #fffaf0; border-left: 4px solid #a58d5a; box-shadow: 2px 3px 0 rgba(74, 49, 18, .17); font-family: Georgia, serif; font-size: clamp(1.05rem, 2.5vw, 1.35rem); line-height: 1.65; padding: 24px; white-space: pre-wrap; }
      .media-card { border-top: 1px dashed var(--line); margin-top: 34px; padding-top: 24px; }
      .media-meta { align-items: baseline; display: flex; flex-wrap: wrap; gap: 8px 13px; margin: 0 0 13px; }
      .media-title { color: var(--muted); font-size: .78rem; font-weight: 650; margin: 0; }
      .media-date { color: var(--red); font-size: .9rem; font-weight: 800; }
      .media { background: #302419; border: 9px solid #fffdf6; box-shadow: 3px 5px 8px rgba(45, 27, 8, .35); display: block; height: min(62vw, 560px); max-height: 65vh; overflow: hidden; width: 100%; }
      img.media { object-fit: contain; }
      .media-card:has(img) { background: #fffdf6; box-shadow: 3px 5px 8px rgba(45, 27, 8, .28); padding: 15px 15px 18px; position: relative; transform: rotate(-.7deg); }
      .media-card:has(img)::before { border: 3px solid #9c3f35; border-bottom: 0; border-radius: 10px 10px 0 0; content: ""; height: 29px; position: absolute; right: 22px; top: -17px; transform: rotate(13deg); width: 12px; z-index: 2; }
      .media-card:has(img):nth-child(even) { transform: rotate(.8deg); }
      .media-card:has(img):nth-child(even)::before { left: 22px; right: auto; transform: rotate(-13deg); }
      .media-card:has(img) .media { border: 0; box-shadow: none; }
      .photo-gallery { border-top: 1px dashed var(--line); display: grid; gap: 24px; grid-auto-flow: dense; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 34px; padding-top: 28px; }
      .photo-gallery .media-card { border: 0; margin: 0; min-width: 0; padding: 15px 15px 18px; }
      .photo-gallery img.media { aspect-ratio: var(--photo-ratio, 1); height: auto; max-height: none; object-fit: cover; }
      .photo-gallery--1 { grid-template-columns: minmax(0, 1fr); }
      .photo-gallery--2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .photo-gallery:not(.photo-gallery--1):not(.photo-gallery--2) .photo--landscape { grid-column: span 2; }
      .document-frame { background: #fffdf7; height: 420px; max-height: none; min-height: 120px; }
      .folder-footer { align-items: end; display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr) minmax(0, 3fr); margin-top: 22px; }
      .instructions { background: #f3e49c; box-shadow: 3px 5px 7px rgba(62, 42, 11, .25); padding: 14px 16px; transform: rotate(1deg); }
      .instructions__label { color: #765b1d; font-size: .68rem; font-weight: 850; letter-spacing: .14em; margin: 0 0 7px; text-transform: uppercase; }
      .instructions iframe { background: transparent; border: 0; display: block; font-size: .85rem; height: 11.2em; line-height: 1.4; max-height: 11.2em; width: 100%; }
      .return { align-items: center; background: #72572c; box-shadow: 3px 4px 0 #372713; color: #fff8e2; display: inline-flex; font-size: .78rem; font-weight: 800; justify-content: center; padding: 12px 18px; text-decoration: none; text-transform: uppercase; width: 100%; }
      .return:hover { background: #503a1d; }
      @media (max-width: 620px) { .folder-footer { align-items: stretch; grid-template-columns: 1fr; } .return { justify-content: center; } .photo-gallery, .photo-gallery--2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .photo-gallery--1 { grid-template-columns: minmax(0, 1fr); } .photo-gallery:not(.photo-gallery--1) .photo--landscape { grid-column: span 2; } }
    </style>
  </head>
  <body>
    <main><article class="folder"><div class="code" id="code"></div><h1 id="title"></h1><div id="content"></div></article><footer class="folder-footer"><a class="return" id="returnLink" href="console.html">Retour aux archives</a><div id="instructions"></div></footer></main>
    <script src="../config/archive-config.example.js"></script>
    <script src="../config/archive-config.local.js"></script>
    <script src="../config/archive-video-config.example.js"></script>
    <script src="../config/archive-video-config.local.js"></script>
    <script src="../config/archive-photo-drive-config.js"></script>
    <script src="../config/progress.js"></script>
    <script>
      const code = new URLSearchParams(window.location.hash.slice(1)).get("code");
      const source = new URLSearchParams(window.location.hash.slice(1)).get("from");
       const item = window.ARCHIVE_CONFIG.media[code];
       const videoLinks = window.ARCHIVE_VIDEO_LINKS || {};
       const photoLinks = window.ARCHIVE_PHOTO_DRIVE_LINKS || {};
       const isLocalArchive = window.location.protocol === "file:";
       (item?.items || []).forEach((mediaItem) => {
         if (videoLinks[mediaItem.source]) mediaItem.externalUrl = videoLinks[mediaItem.source];
         if (!isLocalArchive && mediaItem.type === "image" && photoLinks[mediaItem.source]) mediaItem.source = photoLinks[mediaItem.source];
       });
      if (!item) window.location.replace("acces-refuse.html");
      window.ARCHIVE_PROGRESS.markViewed(code);
      document.title = item.title;
      document.querySelector("#code").textContent = `DOSSIER ${code}`;
      document.querySelector("#title").textContent = item.title;
      const content = document.querySelector("#content");
       const instructionSlot = document.querySelector("#instructions");
       const returnLink = document.querySelector("#returnLink");
       const sortArchiveItems = (items) => [...items].sort((left, right) => {
         const leftIsAnecdote = /(?:^|\/)anecdote\.(?:html?|txt)$/i.test(left.source);
         const rightIsAnecdote = /(?:^|\/)anecdote\.(?:html?|txt)$/i.test(right.source);
         if (leftIsAnecdote !== rightIsAnecdote) return leftIsAnecdote ? -1 : 1;
         return (left.createdAtEpoch ?? Infinity) - (right.createdAtEpoch ?? Infinity);
       });
      if (source === "majorite") {
        returnLink.href = "dossier-majorite.html";
        returnLink.textContent = "Retour au dossier de la majorité";
      }
      function createCard(mediaItem) {
        const card = document.createElement("section");
        card.className = "media-card";
        const meta = document.createElement("div");
        meta.className = "media-meta";
        const heading = document.createElement("h2");
        heading.className = "media-title";
        heading.textContent = mediaItem.title;
        if (mediaItem.createdAt) {
          const date = document.createElement("span");
          date.className = "media-date";
          date.textContent = mediaItem.createdAt;
          meta.append(date);
        }
        meta.append(heading);
        card.append(meta);
        if (mediaItem.type === "image") {
          const image = document.createElement("img");
          image.className = "media";
          image.alt = mediaItem.title;
          image.src = mediaItem.source;
          if (mediaItem.orientation) card.classList.add(`photo--${mediaItem.orientation}`);
          if (mediaItem.width && mediaItem.height) card.style.setProperty("--photo-ratio", `${mediaItem.width} / ${mediaItem.height}`);
          card.append(image);
        } else if (mediaItem.type === "video") {
          const video = document.createElement("video");
          video.className = "media";
          video.controls = true;
          video.src = mediaItem.source;
          card.append(video);
        } else {
          const frame = document.createElement("iframe");
          frame.className = "media";
          const isTextDocument = /\.(?:html?|txt)$/i.test(mediaItem.source);
          if (isTextDocument) {
            frame.classList.add("document-frame");
            if (mediaItem.height) frame.style.height = `${mediaItem.height}px`;
          }
          frame.src = mediaItem.source;
          frame.title = mediaItem.title;
          card.append(frame);
        }
        return card;
      }

       const items = sortArchiveItems(item.items || []);
      for (let index = 0; index < items.length;) {
        const mediaItem = items[index];
        if (mediaItem.type !== "image") {
          content.append(createCard(mediaItem));
          index += 1;
          continue;
        }

        const images = [];
        while (index < items.length && items[index].type === "image") {
          images.push(items[index]);
          index += 1;
        }

        if (images.length === 1) {
          content.append(createCard(images[0]));
          continue;
        }

        const gallery = document.createElement("section");
        gallery.className = `photo-gallery photo-gallery--${Math.min(images.length, 10)}`;
        images.forEach((image) => gallery.append(createCard(image)));
        content.append(gallery);
      }

      if (item.instruction) {
        const instructions = document.createElement("aside");
        instructions.className = "instructions";
        instructions.innerHTML = '<p class="instructions__label">Instructions</p>';
        const frame = document.createElement("iframe");
        frame.src = item.instruction;
        frame.title = "Instructions";
        instructions.append(frame);
        instructionSlot.append(instructions);
      }
    </script>
  </body>
</html>
