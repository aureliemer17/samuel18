<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dossier d'archive</title>
    <style>
      :root { --ink: #1d2941; --muted: #77829a; --violet: #6950e8; --pink: #ef5da8; --mint: #43c7a0; --surface: #ffffff; --line: #e2e7f0; }
      * { box-sizing: border-box; }
      body { background: radial-gradient(circle at 5% 5%, #d9fff1 0, transparent 24%), radial-gradient(circle at 95% 8%, #ffe1c2 0, transparent 29%), #f4f7fc; color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; min-height: 100vh; padding: clamp(18px, 5vw, 52px); }
      main { margin: auto; max-width: 1000px; }
      .folder { background: rgba(255, 255, 255, .86); border: 1px solid rgba(255, 255, 255, .9); border-radius: 28px; box-shadow: 0 20px 70px rgba(48, 66, 104, .16); min-height: 68vh; padding: clamp(24px, 5vw, 60px); }
      .code { color: var(--muted); font-size: .72rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
      h1 { font-size: clamp(2.2rem, 7vw, 5rem); letter-spacing: -.055em; line-height: .95; margin: 10px 0 34px; }
      .text { background: #f7f8fc; border: 1px solid var(--line); border-radius: 18px; font-size: clamp(1.05rem, 2.5vw, 1.4rem); line-height: 1.65; padding: 24px; white-space: pre-wrap; }
      .media-card { border-top: 1px solid var(--line); margin-top: 34px; padding-top: 24px; }
      .media-meta { align-items: baseline; display: flex; flex-wrap: wrap; gap: 8px 13px; margin: 0 0 13px; }
      .media-title { color: var(--muted); font-size: .78rem; font-weight: 650; margin: 0; }
      .media-date { color: var(--ink); font-size: 1rem; font-weight: 800; }
      .media { background: #151a2a; border: 0; border-radius: 18px; box-shadow: 0 10px 27px rgba(38, 47, 79, .15); display: block; height: min(62vw, 560px); max-height: 65vh; overflow: hidden; width: 100%; }
      img.media { object-fit: contain; }
      .document-frame { background: #fffdf7; height: 80vh; max-height: none; min-height: 560px; }
      .folder-footer { align-items: end; display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr) minmax(0, 3fr); margin-top: 22px; }
      .instructions { background: linear-gradient(135deg, #fff7e7, #fff0d6); border: 1px solid #f2c47b; border-radius: 14px; box-shadow: 0 8px 18px rgba(170, 105, 21, .1); padding: 14px 16px; }
      .instructions__label { color: #a9661e; font-size: .68rem; font-weight: 850; letter-spacing: .14em; margin: 0 0 7px; text-transform: uppercase; }
      .instructions iframe { background: transparent; border: 0; display: block; font-size: .85rem; height: 11.2em; line-height: 1.4; max-height: 11.2em; width: 100%; }
      .return { align-items: center; background: linear-gradient(135deg, var(--violet), #8669ed); border-radius: 999px; box-shadow: 0 8px 16px rgba(105, 80, 232, .25); color: #fff; display: inline-flex; font-size: .85rem; font-weight: 800; justify-content: center; padding: 12px 18px; text-decoration: none; width: 100%; }
      .return:hover { background: linear-gradient(135deg, #5740d8, #ed8a3f); }
      @media (max-width: 620px) { .folder-footer { align-items: stretch; grid-template-columns: 1fr; } .return { justify-content: center; } }
    </style>
  </head>
  <body>
    <main><article class="folder"><div class="code" id="code"></div><h1 id="title"></h1><div id="content"></div></article><footer class="folder-footer"><a class="return" href="console.html">Retour aux archives</a><div id="instructions"></div></footer></main>
    <script src="../config/archive-config.js"></script>
    <script>
      const code = new URLSearchParams(window.location.hash.slice(1)).get("code");
      const item = window.ARCHIVE_CONFIG.media[code];
      if (!item) window.location.replace("acces-refuse.html");
      document.title = item.title;
      document.querySelector("#code").textContent = `DOSSIER ${code}`;
      document.querySelector("#title").textContent = item.title;
      const content = document.querySelector("#content");
      const instructionSlot = document.querySelector("#instructions");
      (item.items || []).forEach((mediaItem) => {
        const card = document.createElement("section");
        card.className = "media-card";
        const meta = document.createElement("div");
        meta.className = "media-meta";
        const heading = document.createElement("h2");
        heading.className = "media-title";
        heading.textContent = mediaItem.title;
        if (mediaItem.createdAt) {
          const date = document.createElement("span");
          date.className = "media-date";
          date.textContent = mediaItem.createdAt;
          meta.append(date);
        }
        meta.append(heading);
        card.append(meta);
        if (mediaItem.type === "image") {
          const image = document.createElement("img");
          image.className = "media";
          image.alt = mediaItem.title;
          image.src = mediaItem.source;
          card.append(image);
        } else if (mediaItem.type === "video") {
          const video = document.createElement("video");
          video.className = "media";
          video.controls = true;
          video.src = mediaItem.source;
          card.append(video);
        } else {
          const frame = document.createElement("iframe");
          frame.className = "media";
          const isTextDocument = /\.(?:html?|txt)$/i.test(mediaItem.source);
          if (isTextDocument) {
            frame.classList.add("document-frame");
            frame.addEventListener("load", () => resizeDocumentFrame(frame));
          }
          frame.src = mediaItem.source;
          frame.title = mediaItem.title;
          card.append(frame);
        }
        content.append(card);
      });

      if (item.instruction) {
        const instructions = document.createElement("aside");
        instructions.className = "instructions";
        instructions.innerHTML = '<p class="instructions__label">Instructions</p>';
        const frame = document.createElement("iframe");
        frame.src = item.instruction;
        frame.title = "Instructions";
        instructions.append(frame);
        instructionSlot.append(instructions);
      }

      function resizeDocumentFrame(frame) {
        try {
          const documentHeight = Math.max(
            frame.contentDocument.documentElement.scrollHeight,
            frame.contentDocument.body.scrollHeight,
          );
          frame.style.height = `${documentHeight}px`;
        } catch {
          // PDF and browser-protected documents keep their fixed reader height.
        }
      }
    </script>
  </body>
</html>
