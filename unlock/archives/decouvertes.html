<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#291a11" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <style>html { touch-action: manipulation; }</style>
    <title>Dossier S-18</title>
    <style>
      :root { --ink: #172c4a; --brown: #704c2a; --paper: #fffdf7; --paper-shadow: #e8dfc9; --red: #9d3424; --line: #c8b892; }
      * { box-sizing: border-box; }
      body { background: repeating-linear-gradient(0deg, #291a11 0 2px, #3a2519 2px 7px); color: var(--ink); font-family: Georgia, "Times New Roman", serif; margin: 0; padding: 28px; }
      .toolbar { align-items: center; display: flex; gap: 12px; justify-content: flex-start; margin: 0 auto 22px; max-width: 820px; }
      .toolbar button { background: #f4ead1; border: 1px solid #8b6d42; box-shadow: 2px 3px 0 rgba(0, 0, 0, .3); color: #4b351d; cursor: pointer; font-family: "Courier New", monospace; font-size: .72rem; font-weight: 900; letter-spacing: .06em; padding: 11px 14px; text-transform: uppercase; }
      .toolbar-link { background: #f4ead1; border: 1px solid #8b6d42; box-shadow: 2px 3px 0 rgba(0, 0, 0, .3); color: #4b351d; font-family: "Courier New", monospace; font-size: .72rem; font-weight: 900; letter-spacing: .06em; padding: 11px 14px; text-decoration: none; text-transform: uppercase; }
      .toolbar button:hover { background: #fff9e9; }
      .toolbar-link:hover { background: #fff9e9; }
      .book { margin: auto; max-width: 210mm; perspective: 1800px; }
      .book:not(.open) .pages, .book:not(.open) + .pager { display: none; }
      .cover { align-items: center; background: linear-gradient(135deg, #d6ba70, #f0d995 52%, #c5a257); box-shadow: 0 24px 45px rgba(0, 0, 0, .55), inset 0 0 0 4px rgba(255, 236, 169, .45); cursor: pointer; display: flex; min-height: 297mm; padding: 22mm; position: relative; text-align: center; transform-origin: left center; transition: transform .85s cubic-bezier(.2, .7, .2, 1), opacity .35s ease; z-index: 2; }
      .cover::before { border: 2px solid rgba(91, 57, 17, .48); content: ""; inset: 9mm; pointer-events: none; position: absolute; }
      .cover.open { opacity: 0; pointer-events: none; position: absolute; transform: rotateY(-108deg); }
      .cover.page-visible { opacity: 1; pointer-events: auto; position: relative; transform: none; }
      .cover__content { align-items: center; display: flex; flex-direction: column; margin: auto; max-width: 145mm; min-height: 245mm; position: relative; }
      .logo { display: block; margin: 0 auto 7mm; max-width: 78mm; width: 65%; }
      .division { color: var(--brown); font-family: Arial, sans-serif; font-size: 8pt; letter-spacing: .07em; text-transform: uppercase; }
      .cover h1 { font-size: 28pt; margin: 15mm 0 24mm; text-transform: uppercase; }
      .cover .subtitle { font-size: 20pt; font-style: italic; line-height: 1.25; margin: 0; }
      .cover .name { display: block; font-size: 37pt; margin-top: 3mm; }
      .date { color: var(--red); font-family: Arial, sans-serif; font-size: 9pt; font-weight: 900; margin-top: 9mm; text-transform: uppercase; }
      .cover .quote { color: var(--brown); font-size: 11pt; font-style: italic; margin: auto 0 3mm; }
      .cover .confidential { color: var(--red); font-family: Arial, sans-serif; font-size: 8pt; font-weight: 900; letter-spacing: .04em; margin: 0; text-transform: uppercase; }
      .pages { min-height: 297mm; position: relative; }
      .page { background: repeating-linear-gradient(0deg, transparent 0 27px, rgba(104, 73, 30, .08) 28px 29px), var(--paper); box-shadow: 0 18px 38px rgba(0, 0, 0, .45); min-height: 297mm; overflow: hidden; padding: 15mm; position: relative; }
      .page[hidden] { display: none; }
      .page.turn-out-next { animation: turn-out-next .42s ease-in forwards; transform-origin: left center; }
      @keyframes turn-out-next { to { filter: brightness(.78); opacity: 0; transform: perspective(1600px) rotateY(-88deg); } }
      .page::after { border: 1px solid var(--line); content: ""; inset: 7mm; pointer-events: none; position: absolute; }
      .page > * { position: relative; z-index: 1; }
      .back-cover { background: linear-gradient(135deg, #d6ba70, #f0d995 52%, #c5a257); }
      .back-cover::after { border-color: rgba(91, 57, 17, .48); }
      .page-header { border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; padding-bottom: 4mm; }
      .case { color: var(--red); font-family: "Courier New", monospace; font-size: 9pt; font-weight: 900; }
      .page h2 { font-size: 23pt; line-height: 1.05; margin: 11mm 0 5mm; text-transform: uppercase; }
      .page h3 { font-family: "Courier New", monospace; font-size: 10pt; margin: 0 0 8mm; }
      .status { border: 2px solid var(--red); color: var(--red); display: inline-block; font-family: Arial, sans-serif; font-size: 9pt; font-weight: 900; margin-bottom: 6mm; padding: 3px 7px; text-transform: uppercase; transform: rotate(-3deg); }
      .evidence { background: #fffefa; box-shadow: 3px 5px 9px rgba(53, 34, 10, .3); margin: 0 auto; max-height: 205mm; max-width: 165mm; padding: 6mm 6mm 13mm; position: relative; transform: rotate(-.5deg); }
      .evidence::before { border: 3px solid #a03b35; border-bottom: 0; border-radius: 12px 12px 0 0; content: ""; height: 34px; position: absolute; right: 18mm; top: -20px; transform: rotate(13deg); width: 14px; }
       .evidence img, .evidence video, .evidence iframe { background: #241a10; display: block; height: auto; max-height: 181mm; max-width: 100%; object-fit: contain; width: 100%; }
       .evidence iframe { background: #fff; border: 1px solid #b8aa8d; height: 181mm; }
       .evidence .drive-video { background: #241a10; border: 0; height: auto; }
      .evidence--document { max-width: 169mm; }
      .evidence figcaption { color: var(--brown); font-family: "Courier New", monospace; font-size: 9pt; margin-top: 4mm; }
       .media-sheet { display: grid; gap: 4mm; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); height: 205mm; margin: 0 auto; max-width: 180mm; }
       .media-sheet--one > :only-child { grid-column: span 2; grid-row: span 2; }
       .media-sheet--two-landscape > * { grid-column: span 2; }
       .media-sheet--two-portrait > * { grid-row: span 2; }
       .media-sheet--three-landscape > :first-child { grid-column: span 2; }
       .media-sheet--three-portrait > :first-child { grid-row: span 2; }
       .media-sheet--anecdote-with-media > :first-child { grid-column: span 2; }
       .photo-evidence, .video-evidence, .document-evidence { align-items: center; background: #fffefa; box-shadow: 3px 5px 9px rgba(53, 34, 10, .3); display: flex; justify-content: center; margin: 0; min-height: 0; min-width: 0; padding: 3mm 3mm 8mm; position: relative; transform: rotate(-.6deg); }
       .photo-evidence:nth-child(even), .video-evidence:nth-child(even), .document-evidence:nth-child(even) { transform: rotate(.7deg); }
       .photo-evidence { cursor: zoom-in; }
      .photo-evidence.expanded { align-items: center; background: #fffefa; cursor: zoom-out; display: flex; height: min(88vh, 260mm); justify-content: center; left: 50%; max-width: min(90vw, 190mm); padding: 8mm 8mm 13mm; position: fixed; top: 50%; transform: translate(-50%, -50%) rotate(0); width: 90vw; z-index: 20; }
      .photo-evidence.expanded::after { background: rgba(0, 0, 0, .72); content: ""; height: 100vh; left: 50%; pointer-events: none; position: fixed; top: 50%; transform: translate(-50%, -50%); width: 100vw; z-index: -1; }
      .photo-evidence.expanded img { height: 100%; object-fit: contain; width: 100%; }
      .photo-evidence::before { border: 3px solid #a03b35; border-bottom: 0; border-radius: 10px 10px 0 0; content: ""; height: 25px; position: absolute; right: 12mm; top: -16px; transform: rotate(13deg); width: 11px; z-index: 2; }
      .photo-evidence:nth-child(even)::before { left: 12mm; right: auto; transform: rotate(-13deg); }
      .photo-evidence img { display: block; height: 100%; max-height: 100%; max-width: 100%; object-fit: contain; width: 100%; }
      .photo-evidence figcaption, .video-evidence figcaption { bottom: 2mm; left: 3mm; overflow: hidden; position: absolute; right: 3mm; text-overflow: ellipsis; white-space: nowrap; }
      .evidence-date { color: var(--red); font-family: "Courier New", monospace; font-size: 8pt; font-weight: 900; }
      .evidence-name { color: var(--brown); font-family: "Courier New", monospace; font-size: 7pt; margin-left: 5px; }
      .video-qr-sheet { display: grid; gap: 7mm; grid-template-columns: repeat(2, minmax(0, 1fr)); margin: 0 auto; max-width: 169mm; }
      .video-qr-entry { align-items: center; background: #fffefa; box-shadow: 3px 5px 9px rgba(53, 34, 10, .3); display: flex; flex-direction: column; justify-content: center; min-height: 75mm; padding: 5mm; text-align: center; }
      .video-qr-entry .video-access { margin: 0; }
      .video-qr-entry .video-link { font-size: 8pt; }
      .video-qr-entry .video-qr { display: block; }
      .video-qr-entry .video-qr img { height: 35mm; width: 35mm; }
      .video-qr-entry__title { color: var(--brown); font-family: "Courier New", monospace; font-size: 8pt; font-weight: 900; margin: 0 0 3mm; }
      .video-qr-intro { color: var(--brown); font-size: 11pt; font-style: italic; margin: 0 0 8mm; }
       .video-evidence { flex-direction: column; padding: 5mm 5mm 10mm; }
      .video-evidence::before { border: 3px solid #a03b35; border-bottom: 0; border-radius: 10px 10px 0 0; content: ""; height: 25px; position: absolute; right: 12mm; top: -16px; transform: rotate(13deg); width: 11px; z-index: 2; }
       .video-evidence video, .video-evidence .drive-video { background: #241a10; display: block; max-height: 100%; max-width: 100%; width: 100%; }
       .document-evidence { flex-direction: column; overflow: hidden; padding: 4mm 4mm 11mm; }
       .document-evidence iframe { background: #fff; border: 1px solid #b8aa8d; flex: 1 1 auto; height: 100%; min-height: 0; width: 100%; }
       .document-evidence figcaption { bottom: 2mm; color: var(--brown); font-family: "Courier New", monospace; font-size: 7pt; left: 4mm; position: absolute; right: 4mm; text-transform: uppercase; }
       .drive-video { aspect-ratio: 16 / 9; border: 0; height: auto; }
      .video-evidence .video-link { font-size: 8pt; margin-top: 4mm; padding: 7px 9px; }
      .video-print-note, .video-qr { display: none; }
      .video-link { background: #e8ddb3; border: 1px solid #9a7c41; color: #483318; display: inline-block; font-family: Arial, sans-serif; font-size: 10pt; font-weight: 900; margin-top: 9mm; padding: 10px 14px; text-decoration: none; }
      .video-link:hover { background: #f7edc9; }
      .video-access { align-items: center; display: flex; gap: 4mm; justify-content: center; margin-top: 4mm; }
      .video-access .video-link { margin-top: 0; }
      .video-qr { background: #fff; border: 1px solid #9a7c41; padding: 2mm; text-align: center; }
      .video-qr img { display: block; height: 28mm; image-rendering: pixelated; width: 28mm; }
      .video-qr span { color: #483318; display: block; font-family: Arial, sans-serif; font-size: 6pt; font-weight: 900; margin-top: 1mm; text-transform: uppercase; }
      .contents { columns: 2; font-family: "Courier New", monospace; font-size: 10pt; line-height: 1.55; list-style: none; margin: 8mm 0 0; padding: 0; }
      .contents li { break-inside: avoid; margin-bottom: 3mm; }
      .contents .seen { color: #4f6a3d; font-weight: 900; }
      .contents button { background: transparent; border: 0; color: inherit; cursor: pointer; font: inherit; padding: 0; text-align: left; text-decoration: underline; text-decoration-style: dotted; }
      .contents .export-dossier { background: #eadbb0; border: 1px solid #9b7940; color: #4b351d; font-family: "Courier New", monospace; font-size: 7pt; font-weight: 900; margin-left: 7px; padding: 3px 5px; text-decoration: none; }
       .contents .export-theme { background: #9d3424; border: 1px solid #6d2017; color: #fff8e2; font-family: "Courier New", monospace; font-size: 7pt; font-weight: 900; margin-left: 7px; padding: 3px 5px; text-decoration: none; }
       .inventory-navigation { display: none; }
       @media (max-width: 700px) { body { padding: 10px; } .toolbar { gap: 8px; margin-bottom: 12px; } .toolbar button, .toolbar-link { font-size: .64rem; padding: 9px 10px; } .cover, .page { min-height: auto; } .cover { min-height: calc(100vh - 118px); padding: 15mm 10mm; } .page { padding: 12mm; } .contents { columns: 1; } body.mobile-inventory .book { max-width: 680px; } body.mobile-inventory .page { box-shadow: 0 12px 25px rgba(0, 0, 0, .38); min-height: calc(100vh - 118px); padding: 26px 20px 32px; } body.mobile-inventory .page::after { inset: 9px; } body.mobile-inventory .page h2 { font-size: clamp(1.9rem, 10vw, 3rem); margin: 30px 0 15px; } body.mobile-inventory .contents { font-size: .9rem; line-height: 1.35; margin-top: 22px; } body.mobile-inventory .contents li { margin-bottom: 12px; } body.mobile-inventory .contents li:not(:has(button)) { border-top: 1px solid var(--line); color: var(--red); font-family: Georgia, serif; font-size: 1.08rem; font-weight: 900 !important; margin: 26px 0 11px; padding-top: 22px; } body.mobile-inventory .contents button[data-dossier] { background: #fffaf0; border: 1px solid #ad9b76; box-shadow: 2px 3px 0 rgba(74, 49, 18, .16); display: block; font-family: Georgia, serif; font-size: 1.12rem; line-height: 1.2; padding: 15px; text-align: left; text-decoration: none; width: 100%; } .inventory-navigation { background: #f4ead1; border: 1px solid #8b6d42; color: #4b351d; display: block; font-family: "Courier New", monospace; font-size: .75rem; font-weight: 900; margin: 20px auto 0; padding: 10px 14px; text-transform: uppercase; } }
       @media print { @page { size: A4 portrait; margin: 0; } body { background: #fff; padding: 0; } .toolbar { display: none; } .book { max-width: none; } .book:not(.open) .pages { display: block; } .cover, .page { box-shadow: none; break-after: page; display: flex !important; height: 297mm; margin: 0; min-height: 297mm; opacity: 1 !important; page-break-after: always; position: relative !important; transform: none !important; width: 210mm; } .cover { display: flex !important; } .page { display: block !important; } .pages { display: block; } .page:last-child { break-after: auto; page-break-after: auto; } .evidence video, .video-evidence video, .drive-video { display: none; } .evidence .video-print-note, .video-qr { display: block; } body.exporting-dossier .cover, body.exporting-dossier .page:not(.export-selected), body.exporting-theme .cover, body.exporting-theme .page:not(.export-selected) { display: none !important; } body.exporting-complete .contents .export-dossier, body.exporting-complete .contents .export-theme, body.exporting-theme .contents .export-dossier, body.exporting-theme .contents .export-theme { display: none; } }
    </style>
  </head>
  <body>
    <nav class="toolbar" aria-label="Actions du dossier"><a class="toolbar-link" href="../index.html">Accueil</a><button id="inventory" type="button">Inventaire</button><button id="exportAll" type="button" hidden>PDF complet</button><button id="resetProgress" type="button" hidden>Réinitialiser le suivi</button></nav>
    <main class="book">
      <section class="cover" id="cover" tabindex="0" role="button" aria-label="Ouvrir le dossier"><div class="cover__content"><img class="logo" src="../assets/bureau-majorite.png" alt="Bureau de la Majorité" /><div class="division">Archives personnelles · Restitution à la majorité</div><h1>Dossier S-18</h1><p class="subtitle">Les 18 premières années de<span class="name">Samuel</span></p><p class="date">29 novembre 2026</p><p class="quote">« Une vie entière de souvenirs à découvrir. »</p><p class="confidential">Document confidentiel</p></div></section>
      <section class="pages" id="pages"></section>
    </main>
    <script src="../config/archive-config.example.js"></script>
    <script src="../config/archive-config.local.js"></script>
    <script src="../config/archive-video-config.example.js"></script>
    <script src="../config/archive-video-config.local.js"></script>
    <script src="../config/archive-photo-drive-config.js"></script>
    <script src="../config/progress.js"></script>
    <script>
      const pages = document.querySelector("#pages");
      const adminMode = new URLSearchParams(window.location.search).get("admin") === "1";
      const mobileLayout = window.matchMedia("(max-width: 700px)").matches;
      const openInventory = new URLSearchParams(window.location.search).get("inventory") === "1";
      const viewed = window.ARCHIVE_PROGRESS.viewedCodes();
      const media = window.ARCHIVE_CONFIG.media;
      const videoLinks = window.ARCHIVE_VIDEO_LINKS || {};
      const photoLinks = window.ARCHIVE_PHOTO_DRIVE_LINKS || {};
      const isLocalArchive = window.location.protocol === "file:";
      const photoKey = (source) => {
        try {
          return decodeURIComponent(source).normalize("NFD").replace(/\.[^/.]+$/, "").toLowerCase();
        } catch {
          return source.replace(/\.[^/.]+$/, "").toLowerCase();
        }
      };
      // PDF copies can change .jpeg/.png to .jpg; match the file path without its extension.
      const photoLinkIndex = new Map(Object.entries(photoLinks).map(([source, url]) => [photoKey(source), url]));
       const publishedContentSource = (source) => {
         if (isLocalArchive || !source.startsWith("../../dossiers/")) return source;
         return source
           .replace("../../dossiers/", "../contenu-archives/")
           .split("/")
           .map((segment) => encodeURIComponent(decodeURIComponent(segment).normalize("NFC")))
           .join("/");
       };
       const googleDrivePreviewUrl = (externalUrl) => {
         try {
           const url = new URL(externalUrl);
           const match = url.hostname === "drive.google.com" && url.pathname.match(/^\/file\/d\/([^/]+)/);
           return match ? `https://drive.google.com/file/d/${match[1]}/preview` : null;
         } catch {
           return null;
         }
       };
       const deferSource = (element, source) => {
         element.dataset.src = source;
         return element;
       };
      Object.values(media).forEach((dossier) => (dossier.items || []).forEach((item) => {
        if (videoLinks[item.source]) {
          item.externalUrl = videoLinks[item.source];
          delete item.qrSource;
        }
        if (!isLocalArchive && item.type === "image" && photoLinkIndex.has(photoKey(item.source))) item.source = photoLinkIndex.get(photoKey(item.source));
        if (!isLocalArchive && item.type === "document") item.source = publishedContentSource(item.source);
        if (!isLocalArchive && dossier.instruction) dossier.instruction = publishedContentSource(dossier.instruction);
      }));
      const categories = window.ARCHIVE_CONFIG.categories;
      const sortArchiveItems = (items) => [...items].sort((left, right) => {
        if (left.isRecapVideo !== right.isRecapVideo) return left.isRecapVideo ? -1 : 1;
        const leftIsAnecdote = /(?:^|\/)anecdote\.(?:html?|txt)$/i.test(left.source);
        const rightIsAnecdote = /(?:^|\/)anecdote\.(?:html?|txt)$/i.test(right.source);
        if (leftIsAnecdote !== rightIsAnecdote) return leftIsAnecdote ? -1 : 1;
        return (left.createdAtEpoch ?? Infinity) - (right.createdAtEpoch ?? Infinity);
      });
      const firstPageByDossier = new Map();
      const makePage = (className = "") => {
        const page = document.createElement("section");
        page.className = `page ${className}`;
        return page;
      };
      const makeHeader = (code) => {
        const header = document.createElement("div");
        header.className = "page-header";
        header.innerHTML = `<span class="case">BUREAU DE LA MAJORITÉ</span><span class="case"></span>`;
        header.lastElementChild.textContent = code;
        return header;
      };
      const dossierHeader = (code, pageNumber, totalPages) => adminMode
        ? `DOSSIER ${code} · PIÈCE ${pageNumber} / ${totalPages}`
        : `DOSSIER PERSONNEL · PIÈCE ${pageNumber} / ${totalPages}`;
       const appendVideoAccess = (container, item, includeLink = false) => {
         if (!item.externalUrl) return;
         const embedded = !isLocalArchive && googleDrivePreviewUrl(item.externalUrl);
         const access = document.createElement("div");
         access.className = "video-access";
         if (!embedded || includeLink) {
           const link = document.createElement("a");
           link.className = "video-link";
           link.href = item.externalUrl;
           link.target = "_blank";
           link.rel = "noopener";
           link.textContent = "Voir la vidéo";
           access.append(link);
         }
        if (item.qrSource) {
          const qr = document.createElement("div");
          qr.className = "video-qr";
          const image = document.createElement("img");
           deferSource(image, item.qrSource);
          image.alt = `QR code vers ${item.title}`;
          const label = document.createElement("span");
          label.textContent = "Scanner pour voir la vidéo";
          qr.append(image, label);
          access.append(qr);
        } else {
          const qr = document.createElement("div");
          qr.className = "video-qr";
          const image = document.createElement("img");
          // A web QR service avoids requiring Swift or developer tools on macOS.
           deferSource(image, `https://api.qrserver.com/v1/create-qr-code/?size=496x496&data=${encodeURIComponent(item.externalUrl)}`);
          image.alt = `QR code vers ${item.title}`;
          const label = document.createElement("span");
          label.textContent = "Scanner pour voir la vidéo";
          qr.append(image, label);
          access.append(qr);
        }
        container.append(access);
       };
       const appendVideoPlayer = (container, item) => {
         const drivePreview = !isLocalArchive && googleDrivePreviewUrl(item.externalUrl);
         if (drivePreview) {
           const frame = document.createElement("iframe");
           frame.className = "drive-video";
           deferSource(frame, drivePreview);
           frame.title = item.title;
           frame.allow = "autoplay; encrypted-media; picture-in-picture";
           frame.allowFullscreen = true;
           container.append(frame);
           return;
         }
         const video = document.createElement("video");
         deferSource(video, item.source);
         video.controls = true;
         container.append(video);
       };
       const inventoryStatus = viewed.size === Object.keys(media).length ? "Dossier complet" : "Dossier en cours";
       const inventoryStatusElements = [];
       const inventoryLists = [];
       const categoryEntries = Object.entries(categories);
       // Four themes contain 22 dossiers and the remaining three contain 28.
       // This keeps the 50-entry inventory readable on exactly two A4 pages.
       const splitInventoryAt = 4;
       categoryEntries.forEach(([categoryCode, categoryTitle], categoryIndex) => {
         if (categoryIndex === 0 || categoryIndex === splitInventoryAt) {
           const contents = makePage("contents-page");
           contents.append(makeHeader(categoryIndex === 0 ? "INVENTAIRE" : "INVENTAIRE · SUITE"));
           contents.innerHTML += `<h2>${categoryIndex === 0 ? "Inventaire des découvertes" : "Inventaire des découvertes · suite"}</h2><span class="status">${inventoryStatus}</span>`;
           inventoryStatusElements.push(contents.querySelector(".status"));
           const list = document.createElement("ul");
           list.className = "contents";
           contents.append(list);
           if (categoryIndex === 0) {
             const next = document.createElement("button");
             next.className = "inventory-navigation";
             next.type = "button";
             next.dataset.inventoryNext = "true";
             next.textContent = "Suite de l’inventaire";
             contents.append(next);
           }
           inventoryLists.push(list);
           pages.append(contents);
         }
         const list = inventoryLists[inventoryLists.length - 1];
        const category = document.createElement("li");
         category.textContent = `${categoryCode}. ${categoryTitle.toUpperCase()}`;
        category.style.fontWeight = "900";
        if (adminMode) {
          const exportButton = document.createElement("button");
          exportButton.className = "export-theme";
          exportButton.dataset.exportTheme = categoryCode;
          exportButton.type = "button";
          exportButton.textContent = "PDF";
          exportButton.setAttribute("aria-label", `Exporter ${categoryTitle} en PDF`);
          category.append(exportButton);
        }
        list.append(category);
        Object.entries(media).filter(([code]) => code.startsWith(`${categoryCode}-`)).forEach(([code, dossier]) => {
          const item = document.createElement("li");
          item.className = viewed.has(code) ? "seen" : "";
          if (adminMode || viewed.has(code)) {
            const link = document.createElement("button");
            link.type = "button";
            link.dataset.dossier = code;
            link.textContent = `${viewed.has(code) ? "✓ " : "□ "}${adminMode ? `${code} — ` : ""}${dossier.title}`;
            item.append(link);
            if (adminMode) {
              const exportButton = document.createElement("button");
              exportButton.className = "export-dossier";
              exportButton.dataset.export = code;
              exportButton.type = "button";
              exportButton.textContent = "PDF";
              exportButton.setAttribute("aria-label", `Exporter ${dossier.title} en PDF`);
              item.append(exportButton);
            }
          } else item.textContent = `□ ${dossier.title}`;
          list.append(item);
        });
       });
      function appendSinglePage(code, dossier, item, pageNumber, totalPages) {
          const page = makePage();
          page.dataset.dossier = code;
          page.append(makeHeader(dossierHeader(code, pageNumber, totalPages)));
          const heading = document.createElement("h2");
          heading.textContent = dossier.title;
          const detail = document.createElement("h3");
          detail.textContent = `${categories[code.split("-")[0]]} · ${item.title}${item.createdAt ? ` · ${item.createdAt}` : ""}`;
          page.append(heading, detail);
          const figure = document.createElement("figure");
          figure.className = "evidence";
            if (item.type === "image") { const image = document.createElement("img"); deferSource(image, item.source); image.dataset.pdfSource = item.source; image.alt = item.title; figure.append(image); }
           else if (item.type === "video") { appendVideoPlayer(figure, item); const note = document.createElement("p"); note.className = "video-print-note"; note.textContent = "Vidéo disponible via le lien ci-dessous."; figure.append(note); }
           else { figure.classList.add("evidence--document"); const frame = document.createElement("iframe"); deferSource(frame, item.source); frame.title = item.title; if (item.height) frame.style.height = `${item.height}px`; figure.append(frame); }
          const caption = document.createElement("figcaption"); caption.textContent = `PIÈCE JOINTE : ${item.title}`; figure.append(caption);
          page.append(figure);
          appendVideoAccess(page, item);
          pages.append(page);
          if (pageNumber === 1) firstPageByDossier.set(code, pages.querySelectorAll(".page").length);
      }
       const isPortrait = (item) => item.orientation === "portrait" || (item.height && item.width && item.height > item.width);
       const sheetLayout = (items, includesDocument = false) => {
         if (includesDocument) return "media-sheet--anecdote-with-media";
         if (items.length === 1) return "media-sheet--one";
         if (items.length === 2 && items.every(isPortrait)) return "media-sheet--two-portrait";
         if (items.length === 2 && items.every((item) => !isPortrait(item))) return "media-sheet--two-landscape";
         if (items.length === 3 && items.filter(isPortrait).length >= 2) return "media-sheet--three-portrait";
         if (items.length === 3) return "media-sheet--three-landscape";
         return "";
       };
       function appendMediaEvidence(sheet, item) {
         const figure = document.createElement("figure");
         figure.className = item.type === "image" ? "photo-evidence" : `${item.type}-evidence`;
         if (item.type === "image") {
           const image = document.createElement("img");
           deferSource(image, item.source);
           image.dataset.pdfSource = item.source;
           image.alt = item.title;
           figure.append(image);
         } else if (item.type === "video") {
           appendVideoPlayer(figure, item);
           appendVideoAccess(figure, item);
         } else {
           const frame = document.createElement("iframe");
           deferSource(frame, item.source);
           frame.title = item.title;
           figure.append(frame);
         }
         const caption = document.createElement("figcaption");
         if (item.type === "document") {
           caption.textContent = "PIÈCE JOINTE : ANECDOTE";
         } else {
           caption.innerHTML = `<span class="evidence-date"></span><span class="evidence-name"></span>`;
           caption.querySelector(".evidence-date").textContent = item.createdAt || "";
           caption.querySelector(".evidence-name").textContent = item.title;
         }
         figure.append(caption);
         sheet.append(figure);
       }
       function appendMediaSheet(code, dossier, items, pageNumber, totalPages, includesDocument = false) {
         const page = makePage();
         page.dataset.dossier = code;
         page.append(makeHeader(dossierHeader(code, pageNumber, totalPages)));
        const heading = document.createElement("h2");
        heading.textContent = dossier.title;
        const detail = document.createElement("h3");
         detail.textContent = `${categories[code.split("-")[0]]} · ${items.length} pièce${items.length > 1 ? "s" : ""}`;
         page.append(heading, detail);
         const sheet = document.createElement("section");
         sheet.className = `media-sheet ${sheetLayout(items, includesDocument)}`;
         items.forEach((item) => appendMediaEvidence(sheet, item));
         page.append(sheet);
         pages.append(page);
         if (pageNumber === 1) firstPageByDossier.set(code, pages.querySelectorAll(".page").length);
       }
      function appendVideoQrList(code, dossier, items, pageNumber, totalPages) {
        const page = makePage();
        page.dataset.dossier = code;
        page.append(makeHeader(dossierHeader(code, pageNumber, totalPages)));
        const heading = document.createElement("h2");
        heading.textContent = `${dossier.title} · vidéos à consulter`;
        const intro = document.createElement("p");
        intro.className = "video-qr-intro";
        intro.textContent = "À regarder à votre rythme : scannez le QR code de la vidéo de votre choix.";
        const sheet = document.createElement("section");
        sheet.className = "video-qr-sheet";
        items.forEach((item) => {
          const entry = document.createElement("article");
          entry.className = "video-qr-entry";
          const title = document.createElement("p");
          title.className = "video-qr-entry__title";
          title.textContent = item.title;
          entry.append(title);
           appendVideoAccess(entry, item, true);
          sheet.append(entry);
        });
        page.append(heading, intro, sheet);
        pages.append(page);
      }
       const shortDocument = (item) => item.type === "document" && (item.height || 0) <= 380;
       function buildStandardPlan(items) {
         const plan = [];
         for (let index = 0; index < items.length;) {
           const item = items[index];
           if (shortDocument(item)) {
             const followingMedia = [];
             while (followingMedia.length < 2 && items[index + followingMedia.length + 1] && (items[index + followingMedia.length + 1].type === "image" || items[index + followingMedia.length + 1].type === "video")) {
               followingMedia.push(items[index + followingMedia.length + 1]);
             }
             if (followingMedia.length > 0) {
               plan.push({ type: "sheet", items: [item, ...followingMedia], includesDocument: true });
               index += followingMedia.length + 1;
               continue;
             }
           }
           if (item.type === "image" || item.type === "video") {
             const mediaItems = [];
             while (index < items.length && mediaItems.length < 4 && (items[index].type === "image" || items[index].type === "video")) {
               mediaItems.push(items[index]);
               index += 1;
             }
             plan.push({ type: "sheet", items: mediaItems, includesDocument: false });
             continue;
           }
           plan.push({ type: "single", item });
           index += 1;
         }
         return plan;
       }
       function appendStandardItems(code, dossier, plan, startPage, totalPages) {
         let dossierPage = startPage;
         plan.forEach((entry) => {
           if (entry.type === "sheet") appendMediaSheet(code, dossier, entry.items, dossierPage, totalPages, entry.includesDocument);
           else appendSinglePage(code, dossier, entry.item, dossierPage, totalPages);
           dossierPage += 1;
         });
         return dossierPage;
       }
       Object.entries(media).filter(([code]) => adminMode || viewed.has(code)).forEach(([code, dossier]) => {
         const items = sortArchiveItems(dossier.items || []);
         const recapVideos = items.filter((item) => item.isRecapVideo);
         if (recapVideos.length === 0) {
           const plan = buildStandardPlan(items);
           appendStandardItems(code, dossier, plan, 1, plan.length);
           return;
         }
         const otherVideos = items.filter((item) => item.type === "video" && !item.isRecapVideo && !item.isFeaturedVideo);
         const chronologicalItems = items.filter((item) => item.type !== "video" || item.isFeaturedVideo);
         const plan = buildStandardPlan(chronologicalItems);
         const totalPages = recapVideos.length + plan.length + Math.ceil(otherVideos.length / 4);
        let dossierPage = 1;
        recapVideos.forEach((item) => {
          appendSinglePage(code, dossier, item, dossierPage, totalPages);
          dossierPage += 1;
        });
         dossierPage = appendStandardItems(code, dossier, plan, dossierPage, totalPages);
        for (let index = 0; index < otherVideos.length; index += 4) {
          appendVideoQrList(code, dossier, otherVideos.slice(index, index + 4), dossierPage, totalPages);
          dossierPage += 1;
        }
      });
      pages.append(makePage("back-cover"));
      const cover = document.querySelector("#cover");
       if (adminMode) {
         document.title = "Dossier S-18 - Admin";
         document.querySelector("#exportAll").hidden = false;
         document.querySelector("#resetProgress").hidden = false;
      }
       const documentPages = [...pages.querySelectorAll(".page")];
       const allPages = [cover, ...documentPages];
       let pageIndex = 0;
       let turning = false;
       const loadPageMedia = (page) => {
         if (!page) return;
         page.querySelectorAll("[data-src]").forEach((element) => {
           if (element.closest(".video-qr") && !element.closest(".video-qr-entry") && !document.body.matches(".exporting-dossier, .exporting-complete, .exporting-theme")) return;
           if (!element.getAttribute("src")) element.src = element.dataset.src;
         });
       };
       const unloadPageMedia = (page) => {
         if (!page) return;
         page.querySelectorAll("[data-src]").forEach((element) => {
           if (element.matches("video")) element.pause();
           element.removeAttribute("src");
         });
       };
       const loadVisiblePageMedia = () => {
         loadPageMedia(documentPages[pageIndex - 1]);
       };
       const unloadHiddenPageMedia = () => {
         documentPages.forEach((page, index) => {
           if (index !== pageIndex - 1) unloadPageMedia(page);
         });
       };
       function showPage(index) {
        pageIndex = Math.max(0, Math.min(index, allPages.length - 1));
        const showingCover = pageIndex === 0;
         cover.classList.toggle("page-visible", showingCover);
         cover.classList.toggle("open", !showingCover);
         document.body.classList.toggle("mobile-inventory", mobileLayout && pageIndex === 1);
         documentPages.forEach((page, current) => { page.hidden = showingCover || current !== pageIndex - 1; });
         unloadHiddenPageMedia();
         if (!showingCover) loadVisiblePageMedia();
      }
      function turnPage(index) {
        const nextIndex = Math.max(0, Math.min(index, allPages.length - 1));
        if (turning || nextIndex === pageIndex) return;
        if (pageIndex === 0 || nextIndex <= pageIndex) { showPage(nextIndex); return; }
        turning = true;
        const current = documentPages[pageIndex - 1];
        current.classList.add("turn-out-next");
        window.setTimeout(() => {
          current.classList.remove("turn-out-next");
          showPage(nextIndex);
          turning = false;
        }, 430);
      }
      const open = () => { document.querySelector(".book").classList.add("open"); showPage(1); };
      cover.addEventListener("click", open);
      cover.addEventListener("keydown", (event) => { if (event.key === "Enter" || event.key === " ") open(); });
       document.querySelector("#inventory").addEventListener("click", () => open());
        inventoryLists.forEach((list) => list.addEventListener("click", (event) => {
         const exportThemeButton = event.target.closest("button[data-export-theme]");
         if (exportThemeButton) {
           exportTheme(exportThemeButton.dataset.exportTheme);
           return;
         }
         const exportButton = event.target.closest("button[data-export]");
        if (exportButton) {
          exportDossier(exportButton.dataset.export);
          return;
        }
         const link = event.target.closest("button[data-dossier]");
         if (!link) return;
         if (mobileLayout) {
           window.location.assign(`media.html#code=${encodeURIComponent(link.dataset.dossier)}&from=decouvertes`);
           return;
         }
         showPage(firstPageByDossier.get(link.dataset.dossier));
        }));
        pages.addEventListener("click", (event) => {
          if (event.target.closest("button[data-inventory-next]")) showPage(2);
        });
        pages.addEventListener("click", (event) => {
        const photo = event.target.closest(".photo-evidence");
        if (photo) {
          photo.classList.toggle("expanded");
          return;
        }
         if (event.target.closest("a, button, video, iframe")) return;
         if (mobileLayout) return;
         const bounds = pages.getBoundingClientRect();
         const edgeWidth = Math.min(bounds.width * .24, 190);
         if (event.clientX < bounds.left + edgeWidth) turnPage(pageIndex - 1);
         else if (event.clientX > bounds.right - edgeWidth) turnPage(pageIndex + 1);
      });
       const pdfImageSource = (source) => source.replace("../../dossiers/", "../../dossiers/pdf-images/").replace(/\.[^.]+$/, ".jpg");
         const loadImage = (image) => new Promise((resolve) => {
          if (image.complete) return resolve();
          image.addEventListener("load", resolve, { once: true });
          image.addEventListener("error", resolve, { once: true });
        });
        const loadFrame = (frame) => new Promise((resolve) => {
          frame.addEventListener("load", resolve, { once: true });
          frame.addEventListener("error", resolve, { once: true });
        });
        async function usePdfImages() {
          documentPages.forEach(loadPageMedia);
          const images = [...document.querySelectorAll("img[data-pdf-source]")];
         images.forEach((image) => {
           image.dataset.originalSource = image.src;
           image.onerror = () => { image.onerror = null; image.src = image.dataset.originalSource; };
           image.src = pdfImageSource(image.dataset.pdfSource);
         });
         await Promise.all(images.map(loadImage));
       }
        function restoreOriginalImages() {
         document.querySelectorAll("img[data-original-source]").forEach((image) => {
           image.onerror = null;
           image.src = image.dataset.originalSource;
           delete image.dataset.originalSource;
         });
       }
        async function waitForQrCodes(scope) {
          const qrImages = [...scope.querySelectorAll(".video-qr img")];
          await Promise.all(qrImages.map(loadImage));
        }
        async function preparePdf() {
          const documentFrames = [...document.querySelectorAll("iframe[data-src]:not(.drive-video)")]
            .filter((frame) => !frame.getAttribute("src"));
          const documentsReady = Promise.all(documentFrames.map(loadFrame));
          await usePdfImages();
          await Promise.all([
            waitForQrCodes(document.querySelector("#pages")),
            documentsReady,
          ]);
        }
        function resetExport(previousTitle, previousInventoryStatus = null) {
          document.title = previousTitle;
          document.body.classList.remove("exporting-dossier");
          document.body.classList.remove("exporting-complete");
          document.body.classList.remove("exporting-theme");
         document.querySelectorAll(".page[data-dossier]").forEach((page) => page.classList.remove("export-selected"));
           if (previousInventoryStatus !== null) inventoryStatusElements.forEach((element) => { element.textContent = previousInventoryStatus; });
          restoreOriginalImages();
          unloadHiddenPageMedia();
          loadVisiblePageMedia();
       }
       async function exportDossier(selected) {
         const previousTitle = document.title;
         document.title = `${selected} - ${media[selected].title}`;
        document.body.classList.add("exporting-dossier");
        document.querySelectorAll(".page[data-dossier]").forEach((page) => {
          page.classList.toggle("export-selected", page.dataset.dossier === selected);
        });
         window.addEventListener("afterprint", () => resetExport(previousTitle), { once: true });
          await preparePdf();
         window.print();
       }
        async function exportComplete() {
         const previousTitle = document.title;
           const previousInventoryStatus = inventoryStatusElements[0].textContent;
         document.title = "Dossier S-18 - Archives complètes";
         document.body.classList.add("exporting-complete");
           inventoryStatusElements.forEach((element) => { element.textContent = "Dossier complet"; });
         window.addEventListener("afterprint", () => resetExport(previousTitle, previousInventoryStatus), { once: true });
           await preparePdf();
          window.print();
        }
        async function exportTheme(categoryCode) {
          const previousTitle = document.title;
          const previousInventoryStatus = inventoryStatusElements[0].textContent;
          document.title = `${categoryCode} - ${categories[categoryCode]}`;
          document.body.classList.add("exporting-theme");
          inventoryStatusElements.forEach((element) => { element.textContent = "Dossier complet"; });
          document.querySelectorAll(".page[data-dossier]").forEach((page) => {
            page.classList.toggle("export-selected", page.dataset.dossier.startsWith(`${categoryCode}-`));
          });
          window.addEventListener("afterprint", () => resetExport(previousTitle, previousInventoryStatus), { once: true });
          await preparePdf();
          window.print();
        }
        document.querySelector("#exportAll").addEventListener("click", () => exportComplete());
      document.querySelector("#resetProgress").addEventListener("click", () => {
        if (adminMode && window.confirm("Réinitialiser le suivi des dossiers consultés sur ce navigateur ?")) {
          window.ARCHIVE_PROGRESS.reset();
          window.location.reload();
        }
      });
       if (openInventory) open();
       else showPage(0);
    </script>
  </body>
