<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dossiers à découvrir</title>
    <style>
      :root { --ink: #1d2941; --muted: #77829a; --violet: #6950e8; --line: #e2e7f0; }
      * { box-sizing: border-box; }
      body { background: radial-gradient(circle at 5% 5%, #d9fff1 0, transparent 24%), radial-gradient(circle at 95% 8%, #ffe1c2 0, transparent 29%), #f4f7fc; color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; min-height: 100vh; padding: clamp(18px, 5vw, 52px); }
      main { margin: auto; max-width: 960px; }
      .board { background: rgba(255, 255, 255, .86); border: 1px solid rgba(255, 255, 255, .9); border-radius: 28px; box-shadow: 0 20px 70px rgba(48, 66, 104, .16); padding: clamp(24px, 5vw, 60px); }
      .label { color: var(--muted); font-family: ui-monospace, monospace; font-size: .72rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
      h1 { font-size: clamp(2.2rem, 7vw, 5rem); letter-spacing: -.055em; line-height: .95; margin: 12px 0 14px; }
      .progress { color: var(--muted); font-size: .95rem; margin: 0 0 32px; }
      .categories { display: grid; gap: 28px; }
      .category { border-top: 1px solid var(--line); padding-top: 22px; }
      .category:first-child { border-top: 0; padding-top: 0; }
      h2 { font-size: 1.35rem; letter-spacing: -.03em; margin: 0 0 12px; }
      .list { display: grid; gap: 9px; }
      .item { align-items: center; background: #f7f8fc; border: 1px solid var(--line); border-radius: 13px; display: flex; font-weight: 700; gap: 12px; padding: 14px 16px; }
      .item.viewed { background: linear-gradient(135deg, #effaf2, #f8fffa); border-color: #b9e2c5; }
      .state { align-items: center; border: 1px solid #cdd5e0; border-radius: 50%; color: #9aa6b5; display: inline-flex; flex: 0 0 auto; font-size: .75rem; font-weight: 900; height: 22px; justify-content: center; width: 22px; }
      .item.viewed .state { background: #43a06a; border-color: #43a06a; color: #fff; }
      .state-text { color: var(--muted); font-size: .78rem; font-weight: 650; margin-left: auto; }
      .item.viewed .state-text { color: #287348; }
      .empty { color: var(--muted); font-size: .9rem; margin: 0; }
    </style>
  </head>
  <body>
    <main><article class="board"><div class="label">Dossiers à découvrir</div><h1>Les découvertes de Samuel</h1><p class="progress" id="progress"></p><section class="categories" id="categories"></section></article></main>
    <script src="../config/archive-config.js"></script>
    <script src="../config/progress.js"></script>
    <script>
      const container = document.querySelector("#categories");
      const viewed = window.ARCHIVE_PROGRESS.viewedCodes();
      const media = window.ARCHIVE_CONFIG.media;
      const total = Object.keys(media).length;
      document.querySelector("#progress").textContent = `${viewed.size} découverte${viewed.size > 1 ? "s" : ""} sur ${total}`;
      Object.entries(window.ARCHIVE_CONFIG.categories).forEach(([code, title]) => {
        const entries = Object.entries(media).filter(([dossierCode]) => dossierCode.startsWith(`${code}-`));
        const category = document.createElement("section");
        category.className = "category";
        category.innerHTML = `<h2></h2><div class="list"></div>`;
        category.querySelector("h2").textContent = title;
        const list = category.querySelector(".list");
        if (!entries.length) list.innerHTML = '<p class="empty">Aucune découverte pour le moment.</p>';
        entries.forEach(([dossierCode, item]) => {
          const seen = viewed.has(dossierCode);
          const row = document.createElement("div");
          row.className = `item${seen ? " viewed" : ""}`;
          row.innerHTML = `<span class="state">${seen ? "✓" : "?"}</span><span></span><span class="state-text"></span>`;
          row.children[1].textContent = item.title;
          row.children[2].textContent = seen ? "Découvert" : "À découvrir";
          list.append(row);
        });
        container.append(category);
      });
    </script>
  </body>
</html>
