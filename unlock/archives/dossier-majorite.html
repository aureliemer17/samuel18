<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Le dossier de la majorité de Samuel</title>
    <style>
      :root { --ink: #1d2941; --muted: #77829a; --violet: #6950e8; --orange: #ed8a3f; --mint: #43c7a0; --surface: #ffffff; --line: #e2e7f0; }
      * { box-sizing: border-box; }
      body { background: radial-gradient(circle at 5% 5%, #d9fff1 0, transparent 24%), radial-gradient(circle at 95% 8%, #ffe1c2 0, transparent 29%), #f4f7fc; color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; min-height: 100vh; padding: clamp(18px, 5vw, 52px); }
      main { margin: auto; max-width: 1100px; }
      .dossier { background: rgba(255, 255, 255, .86); border: 1px solid rgba(255, 255, 255, .9); border-radius: 28px; box-shadow: 0 20px 70px rgba(48, 66, 104, .16); padding: clamp(24px, 5vw, 60px); }
      header { border-bottom: 1px solid var(--line); margin-bottom: 35px; padding-bottom: 26px; }
      .header-row { align-items: start; display: flex; gap: 20px; justify-content: space-between; }
      .label { color: var(--muted); font-family: ui-monospace, monospace; font-size: .72rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
      .progress { color: var(--muted); font-size: .82rem; font-weight: 700; margin: 15px 0 0; }
      .reset { background: #fff4f1; border: 1px solid #efc9c0; border-radius: 999px; color: #a54d42; cursor: pointer; flex: 0 0 auto; font-family: ui-monospace, monospace; font-size: .72rem; font-weight: 800; letter-spacing: .06em; padding: 10px 13px; text-transform: uppercase; }
      .reset:hover { background: #ffe7e0; }
      h1 { font-size: clamp(2.2rem, 7vw, 5rem); letter-spacing: -.055em; line-height: .95; margin: 12px 0 0; }
      .categories { display: grid; gap: 28px; }
      .category { border-top: 1px solid var(--line); padding-top: 22px; }
      .category:first-child { border-top: 0; padding-top: 0; }
      .category-heading { align-items: center; display: flex; gap: 12px; margin: 0 0 15px; }
      .category-code { color: var(--violet); font-family: ui-monospace, monospace; font-size: 1.35rem; font-weight: 900; letter-spacing: -.03em; }
      .category-name { font-size: 1.35rem; letter-spacing: -.03em; margin: 0; }
      .dossiers { display: grid; gap: 9px; }
      .dossier-link { align-items: center; background: #f7f8fc; border: 1px solid var(--line); border-radius: 13px; color: var(--ink); display: flex; font-size: 1rem; font-weight: 700; gap: 12px; min-height: 0; padding: 14px 16px; text-decoration: none; transition: background .15s, box-shadow .15s, transform .15s; }
      .dossier-link:hover { background: #fff; box-shadow: 0 10px 21px rgba(53, 68, 101, .13); transform: translateY(-2px); }
      .dossier-link.viewed { background: linear-gradient(135deg, #effaf2, #f8fffa); border-color: #b9e2c5; }
      .status-icon { align-items: center; border: 1px solid #cdd5e0; border-radius: 50%; color: #9aa6b5; display: inline-flex; flex: 0 0 auto; font-size: .75rem; font-weight: 900; height: 22px; justify-content: center; width: 22px; }
      .dossier-link.viewed .status-icon { background: #43a06a; border-color: #43a06a; color: #fff; }
      .dossier-code { color: var(--violet); font-family: ui-monospace, monospace; font-size: 1rem; font-weight: 900; letter-spacing: 0; }
      .dossier-title { font-size: 1rem; font-weight: 700; line-height: 1.25; }
      .empty { background: #f7f8fc; border: 1px dashed #ccd5e3; border-radius: 14px; color: var(--muted); font-size: .9rem; margin: 0; padding: 14px; }
    </style>
  </head>
  <body>
    <main><article class="dossier"><header><div class="header-row"><div><div class="label">ACCÈS ADMINISTRATEUR</div><h1>Le dossier de la majorité de Samuel</h1></div><button class="reset" id="reset" type="button">Réinitialiser le suivi</button></div><p class="progress" id="progress"></p></header><section class="categories" id="categories"></section></article></main>
    <script src="../config/archive-config.js"></script>
    <script src="../config/progress.js"></script>
    <script>
      const container = document.querySelector("#categories");
      const media = window.ARCHIVE_CONFIG.media;
      function render() {
        const viewedCodes = window.ARCHIVE_PROGRESS.viewedCodes();
        const total = Object.keys(media).length;
        container.replaceChildren();
        document.querySelector("#progress").textContent = `${viewedCodes.size} dossier${viewedCodes.size > 1 ? "s" : ""} consulté${viewedCodes.size > 1 ? "s" : ""} sur ${total}`;
        Object.entries(window.ARCHIVE_CONFIG.categories).forEach(([code, title]) => {
          const category = document.createElement("section");
          category.className = "category";
          category.innerHTML = `<div class="category-heading"><span class="category-code">${code}</span><h2 class="category-name"></h2></div><div class="dossiers"></div>`;
          category.querySelector(".category-name").textContent = title;
          const dossiers = Object.entries(media).filter(([dossierCode]) => dossierCode.startsWith(`${code}-`));
          const list = category.querySelector(".dossiers");
          if (!dossiers.length) list.innerHTML = '<p class="empty">Aucun dossier référencé dans cette catégorie.</p>';
          dossiers.forEach(([dossierCode, item]) => {
            const link = document.createElement("a");
            link.className = "dossier-link";
            if (viewedCodes.has(dossierCode)) link.classList.add("viewed");
            link.href = `media.html#code=${encodeURIComponent(dossierCode)}&from=majorite`;
            link.innerHTML = `<span class="status-icon" aria-label="${viewedCodes.has(dossierCode) ? "Consulté" : "Non consulté"}">${viewedCodes.has(dossierCode) ? "✓" : "?"}</span><span class="dossier-code"></span><strong class="dossier-title"></strong>`;
            link.querySelector(".dossier-code").textContent = dossierCode;
            link.querySelector(".dossier-title").textContent = item.title;
            list.append(link);
          });
          container.append(category);
        });
      }
      document.querySelector("#reset").addEventListener("click", () => {
        if (window.confirm("Réinitialiser le suivi des dossiers consultés sur ce navigateur ?")) {
          window.ARCHIVE_PROGRESS.reset();
          render();
        }
      });
      render();
    </script>
  </body>
</html>
