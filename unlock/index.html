<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accueil</title>
    <style>
      :root { --ink: #273346; --steel: #dce3ec; --cream: #ffffff; --orange: #ee913f; }
      * { box-sizing: border-box; }
      body { align-items: center; background: radial-gradient(circle at 5% 5%, #e1f7ff 0, transparent 25%), radial-gradient(circle at 95% 8%, #ffe7cc 0, transparent 30%), #f7f9fc; display: flex; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; justify-content: center; margin: 0; min-height: 100vh; padding: 24px; }
      main { display: grid; gap: clamp(30px, 7vw, 76px); grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 680px; width: 100%; }
      .choice { color: var(--ink); display: grid; font-size: clamp(.8rem, 2.5vw, 1rem); font-weight: 900; gap: 15px; justify-items: center; letter-spacing: .13em; text-decoration: none; text-transform: uppercase; }
      .button { align-items: center; aspect-ratio: 1; background: linear-gradient(145deg, #fff, #e6ebf1 55%, #c7d0db); border: clamp(5px, 1vw, 8px) solid #c3ccd7; border-radius: 50%; box-shadow: inset 0 3px 3px rgba(255, 255, 255, .9), inset 0 -10px 18px #bec8d4, 0 14px 0 #9faab7, 0 25px 35px rgba(40, 55, 75, .2); display: grid; max-width: 250px; place-items: center; transition: transform .15s, box-shadow .15s; width: 100%; }
      .choice:hover .button { box-shadow: inset 0 3px 3px rgba(255, 255, 255, 1), inset 0 -10px 18px #bec8d4, 0 10px 0 #9faab7, 0 19px 28px rgba(40, 55, 75, .17); transform: translateY(4px); }
      .choice:focus-visible { outline: 3px solid var(--orange); outline-offset: 7px; }
      .bulb { background: radial-gradient(circle at 38% 31%, #fffbd0, #ffe879 31%, #e3a52a 58%, #8d5d12 100%); border: 5px solid #473b18; border-radius: 50% 50% 43% 43%; box-shadow: 0 0 20px rgba(255, 222, 97, .6); height: 42%; position: relative; width: 34%; }
      .bulb::before { border-left: 3px solid #644a14; border-right: 3px solid #644a14; content: ""; height: 35%; left: 50%; position: absolute; top: 26%; transform: translateX(-50%); width: 28%; }
      .bulb::after { background: repeating-linear-gradient(#8d8c81 0 4px, #343833 4px 8px); border: 3px solid #292d28; border-radius: 0 0 8px 8px; bottom: -22%; content: ""; height: 25%; left: 18%; position: absolute; width: 64%; }
      .gear { aspect-ratio: 1; background: repeating-conic-gradient(#a9c77f 0deg 11deg, #33503b 11deg 22deg); clip-path: polygon(50% 0%, 61% 8%, 75% 3%, 78% 17%, 92% 20%, 85% 32%, 100% 42%, 87% 50%, 100% 60%, 85% 68%, 92% 81%, 77% 83%, 74% 97%, 61% 92%, 50% 100%, 40% 92%, 27% 97%, 23% 83%, 8% 81%, 15% 68%, 0% 60%, 13% 50%, 0% 42%, 15% 32%, 8% 20%, 22% 17%, 25% 3%, 39% 8%); filter: drop-shadow(0 5px 2px rgba(0, 0, 0, .35)); position: relative; width: 52%; }
      @media (max-width: 400px) { main { gap: 24px; } .choice { font-size: .72rem; } }
    </style>
  </head>
  <body>
    <main>
      <a class="choice" href="jeu/indices.html"><span>Indice</span><span class="button"><span class="bulb" aria-hidden="true"></span></span></a>
      <a class="choice" href="jeu/machine.html"><span>Machines</span><span class="button"><span class="gear" aria-hidden="true"></span></span></a>
    </main>
  </body>
</html>
