<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accueil</title>
    <style>
      :root { --ink: #273346; --orange: #ee913f; }
      * { box-sizing: border-box; }
      body { align-items: center; background: radial-gradient(ellipse at 50% 42%, rgba(227, 190, 110, .31) 0, rgba(128, 82, 33, .14) 26%, transparent 55%), repeating-linear-gradient(5deg, rgba(255, 202, 126, .08) 0 2px, transparent 3px 12px), repeating-linear-gradient(94deg, #2a130b 0 7px, #3f2011 8px 19px, #281109 20px 29px); display: flex; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; justify-content: center; margin: 0; min-height: 100vh; padding: 24px; position: relative; }
      body::before { background: radial-gradient(ellipse at center, transparent 38%, rgba(10, 4, 2, .5) 100%); content: ""; inset: 0; pointer-events: none; position: fixed; }
      body::after { background: linear-gradient(115deg, transparent 0 42%, rgba(255, 239, 191, .08) 49%, transparent 56%); content: ""; inset: 0; pointer-events: none; position: fixed; }
      main { aspect-ratio: 1; background: linear-gradient(145deg, #202321, #090b0a 56%, #171916); border: 3px solid #b48a3e; box-shadow: inset 0 0 0 4px #4b381a, inset 0 0 45px rgba(0, 0, 0, .8), 0 20px 38px rgba(0, 0, 0, .42); max-width: 720px; position: relative; width: min(100%, 720px); }
      .choice { color: #fff4cf; display: grid; font-size: clamp(.64rem, 1.8vw, .82rem); font-weight: 900; gap: 10px; justify-items: center; letter-spacing: .1em; position: absolute; text-decoration: none; text-shadow: 0 2px 2px rgba(0, 0, 0, .8); text-transform: uppercase; width: 23%; }
      .choice--indice { left: 38.5%; top: 3%; }
      .choice--machine { bottom: 7%; left: 4%; }
      .choice--dossier { bottom: 7%; right: 4%; }
      .button { aspect-ratio: 1; background: linear-gradient(145deg, #fff, #e6ebf1 55%, #c7d0db); border: clamp(5px, 1vw, 8px) solid #c3ccd7; border-radius: 24%; box-shadow: inset 0 3px 3px rgba(255, 255, 255, .9), inset 0 -8px 13px rgba(124, 139, 155, .42), 0 8px 0 #9faab7, 0 13px 17px rgba(40, 55, 75, .17); display: grid; overflow: hidden; place-items: center; transition: transform .12s, box-shadow .12s; width: 100%; }
      .choice:hover .button { box-shadow: inset 0 3px 3px rgba(255, 255, 255, 1), inset 0 -8px 13px rgba(124, 139, 155, .42), 0 5px 0 #9faab7, 0 9px 12px rgba(40, 55, 75, .14); transform: translateY(3px); }
      .choice:active .button { box-shadow: inset 0 5px 12px rgba(87, 101, 118, .45), 0 1px 0 #9faab7, 0 3px 5px rgba(40, 55, 75, .14); transform: translateY(7px); }
      .choice:focus-visible { outline: 3px solid var(--orange); outline-offset: 7px; }
      .button img { display: block; height: 100%; object-fit: contain; pointer-events: none; transform: scale(1.06); transition: transform .12s; width: 100%; }
      .choice:hover .button img { transform: scale(1.1); }
      .choice:active .button img { transform: scale(1.05); }
      .seal { align-items: center; background: #fffdf7; border: clamp(5px, 1vw, 9px) solid #d5c9ae; border-radius: 50%; box-shadow: inset 0 0 0 3px #8d7855, 0 14px 26px rgba(40, 55, 75, .18); display: grid; left: 50%; padding: 5%; place-items: center; position: absolute; top: 56%; transform: translate(-50%, -50%); width: 30%; }
      .seal img { display: block; height: auto; width: 100%; }
      @media (max-width: 480px) { body { padding: 14px; } .choice { font-size: .58rem; letter-spacing: .06em; width: 26%; } .choice--indice { left: 37%; } .choice--machine { bottom: 9%; left: 2%; } .choice--dossier { bottom: 9%; right: 2%; } .seal { top: 55%; width: 34%; } }
    </style>
  </head>
  <body>
    <main>
      <div class="seal"><img src="assets/bureau-majorite.png" alt="Bureau de la Majorité" /></div>
      <a class="choice choice--indice" href="jeu/indices.html"><span>Indice</span><span class="button"><img src="assets/indice.png" alt="" /></span></a>
      <a class="choice choice--machine" href="jeu/machine.html"><span>Machine</span><span class="button"><img src="assets/machine.png" alt="" /></span></a>
      <a class="choice choice--dossier" href="archives/decouvertes.html"><span>Dossier S-18</span><span class="button"><img src="assets/dossier.png" alt="" /></span></a>
    </main>
  </body>
</html>
