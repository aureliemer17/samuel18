<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#291a11" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Unlock</title>
    <style>
      :root { --ink: #273346; --orange: #ee913f; }
      * { box-sizing: border-box; }
      body { align-items: center; background: url("assets/index_background.png") center bottom / cover no-repeat; display: flex; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; justify-content: center; margin: 0; min-height: 100vh; padding: 24px; }
      main { aspect-ratio: 1; margin-bottom: 8vh; max-width: 720px; position: relative; width: min(100%, 720px); }
      .choice { color: #fff4cf; display: grid; font-size: clamp(.64rem, 1.8vw, .82rem); font-weight: 900; gap: 10px; justify-items: center; letter-spacing: .1em; position: absolute; text-decoration: none; text-shadow: 0 2px 2px rgba(0, 0, 0, .8); text-transform: uppercase; width: 23%; }
      .choice--indice { left: 5%; top: 5%; }
      .choice--machine { right: 5%; top: 5%; }
      .choice--dossier { bottom: 5%; left: 38.5%; }
      .button { aspect-ratio: 1; background: linear-gradient(145deg, #fff4cf, #e7bd69 54%, #bd7c32); border: 0; border-radius: 24%; box-shadow: inset 0 3px 3px rgba(255, 255, 239, .9), inset 0 -8px 13px rgba(157, 95, 30, .3), 0 15px 21px rgba(48, 24, 6, .48); display: grid; overflow: hidden; place-items: center; transition: transform .12s, box-shadow .12s; width: 100%; }
      .choice:hover .button { box-shadow: inset 0 3px 3px rgba(255, 255, 239, 1), inset 0 -8px 13px rgba(157, 95, 30, .3), 0 10px 15px rgba(48, 24, 6, .42); transform: translateY(3px); }
      .choice:active .button { box-shadow: inset 0 5px 12px rgba(127, 74, 20, .43), 0 2px 4px rgba(48, 24, 6, .24); transform: translateY(7px); }
      .choice:focus-visible { outline: 3px solid var(--orange); outline-offset: 7px; }
      .button img { display: block; height: 100%; object-fit: contain; pointer-events: none; transform: scale(1.06); transition: transform .12s; width: 100%; }
      .choice:hover .button img { transform: scale(1.1); }
      .choice:active .button img { transform: scale(1.05); }
      .seal { align-items: center; background: #fffdf7; border: clamp(5px, 1vw, 9px) solid #d5c9ae; border-radius: 50%; box-shadow: inset 0 0 0 3px #8d7855, 0 14px 26px rgba(40, 55, 75, .18); display: grid; left: 50%; padding: 5%; place-items: center; position: absolute; top: 47%; transform: translate(-50%, -50%); width: 30%; }
      .seal img { display: block; height: auto; width: 100%; }
      @media (max-width: 480px) { body { background-image: url("assets/index_background_mobile.png"); padding: 14px; } main { margin-bottom: 12vh; } .choice { font-size: .58rem; letter-spacing: .06em; width: 26%; } .choice--indice { left: 2%; top: 7%; } .choice--machine { right: 2%; top: 7%; } .choice--dossier { bottom: 7%; left: 37%; } .seal { top: 47%; width: 34%; } }
    </style>
  </head>
  <body>
    <main>
      <div class="seal"><img src="assets/bureau-majorite.png" alt="Bureau de la Majorité" /></div>
      <a class="choice choice--indice" href="jeu/indices.html"><span>Indice</span><span class="button"><img src="assets/indice.png" alt="" /></span></a>
      <a class="choice choice--machine" href="jeu/machine.html"><span>Machine</span><span class="button"><img src="assets/machine.png" alt="" /></span></a>
      <a class="choice choice--dossier" href="archives/decouvertes.html"><span>Dossier S-18</span><span class="button"><img src="assets/dossier.png" alt="" /></span></a>
    </main>
  </body>
</html>
