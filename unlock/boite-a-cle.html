<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='9' fill='%23131418'/%3E%3Ccircle cx='32' cy='32' r='18' fill='%23d9d5c9'/%3E%3Cpath d='M32 19v26M19 32h26' stroke='%23131418' stroke-width='5'/%3E%3C/svg%3E" />
    <title>Boite a cle</title>
    <style>
      :root { --black: #111216; --case: #26272b; --edge: #4d4e54; --key: #d9d6ca; --ink: #1d1d20; --red: #d94b45; --screen: #b9d5b8; }
      * { box-sizing: border-box; }
      body { align-items: center; background: radial-gradient(circle at 45% 0%, #f7f5ee, #b9b9b5 70%); display: flex; font-family: Arial, sans-serif; justify-content: center; margin: 0; min-height: 100vh; padding: 20px; }
      main { display: grid; place-items: center; width: min(100%, 420px); }
      .keybox { background: linear-gradient(145deg, #53545a 0%, #1b1c20 14%, #090a0c 58%, #34353a 100%); border: 5px solid #0b0c0e; border-radius: 30px 30px 21px 21px; box-shadow: 15px 18px 20px rgba(0, 0, 0, .38), inset 0 2px 2px rgba(255, 255, 255, .18), inset 0 -4px 8px #000; padding: 27px 25px 30px; position: relative; width: min(100%, 286px); }
      .keybox::before { border: 3px solid #5f6066; border-bottom: 0; border-radius: 21px 21px 0 0; content: ""; inset: 10px 12px auto; height: 28px; opacity: .65; position: absolute; }
      .brand { background: radial-gradient(circle at 50% 35%, #6e7075, #1d1e22 70%); border: 2px solid #0a0b0d; border-radius: 9px 9px 12px 12px; box-shadow: inset 0 1px 2px #919298, 0 2px 2px #000; height: 39px; margin: 0 auto 17px; transform: perspective(45px) rotateX(7deg); width: 67px; }
      .display { align-items: center; background: #161c18; border: 3px solid #060706; border-radius: 5px; box-shadow: inset 0 0 9px #000, 0 1px 1px rgba(255, 255, 255, .25); color: var(--screen); display: flex; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 1.2rem; font-weight: 800; height: 38px; justify-content: center; letter-spacing: .35em; margin: 0 auto 18px; padding-left: .35em; text-shadow: 0 0 5px #9eff9a; width: 154px; }
      .keypad { display: grid; gap: 9px 11px; grid-template-columns: repeat(3, 1fr); margin: 0 auto; width: 174px; }
      .key { appearance: none; background: linear-gradient(145deg, #faf8ef, #aaa79e 55%, #eeece3); border: 2px solid #1a1a1c; border-radius: 7px; box-shadow: inset 0 1px 1px #fff, inset 0 -2px 2px #77746d, 0 3px 0 #08090b, 0 4px 3px rgba(0, 0, 0, .6); color: var(--ink); cursor: pointer; font-family: Georgia, serif; font-size: 1.25rem; font-weight: 900; height: 37px; line-height: 1; padding: 0; transition: transform .06s, box-shadow .06s; }
      .key:active { box-shadow: inset 0 1px 3px #6b6963, 0 1px 0 #08090b; transform: translateY(2px); }
      .key--symbol { font-size: 1.35rem; }
      .key--clear { background: linear-gradient(145deg, #fff3ec, #e25f56 54%, #b72827); color: #fff; grid-column: 2; margin-top: 3px; text-shadow: 0 1px #711b1b; }
      .error { animation: shake .3s linear; }
      .success { align-items: center; background: linear-gradient(145deg, #1c1d20, #060708); border: 5px solid #0b0c0e; border-radius: 24px; box-shadow: 15px 18px 20px rgba(0, 0, 0, .38), inset 0 0 20px #000; color: #e6e3d9; display: none; flex-direction: column; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; justify-content: center; min-height: 320px; padding: 30px; text-align: center; width: min(100%, 286px); }
      .success.visible { display: flex; }
      .success__label { color: #9ff08c; font-size: .86rem; font-weight: 900; letter-spacing: .2em; text-shadow: 0 0 8px #7bee66; }
      .success__code { font-size: clamp(2.2rem, 13vw, 3.6rem); font-weight: 900; letter-spacing: .1em; margin-top: 18px; }
      .return-link { align-items: center; background: #17261e; border: 2px solid #0b120e; border-radius: 999px; box-shadow: inset 0 1px 1px rgba(255, 255, 255, .2), 0 2px 3px rgba(0, 0, 0, .35); color: #e4edc6; display: inline-flex; font-family: Arial, sans-serif; font-size: .65rem; font-weight: 900; gap: 6px; letter-spacing: .08em; margin-top: 18px; padding: 5px 9px 5px 6px; text-decoration: none; text-transform: uppercase; }
      .return-link:focus-visible { outline: 3px solid var(--red); outline-offset: 3px; }
      .return-gear { background: repeating-conic-gradient(#9fbd77 0deg 12deg, #39533b 12deg 24deg); clip-path: polygon(50% 0%, 61% 8%, 75% 3%, 78% 17%, 92% 20%, 85% 32%, 100% 42%, 87% 50%, 100% 60%, 85% 68%, 92% 81%, 77% 83%, 74% 97%, 61% 92%, 50% 100%, 40% 92%, 27% 97%, 23% 83%, 8% 81%, 15% 68%, 0% 60%, 13% 50%, 0% 42%, 15% 32%, 8% 20%, 22% 17%, 25% 3%, 39% 8%); height: 22px; position: relative; width: 22px; }
      .return-gear::after { background: #17261e; border: 2px solid #bed58d; border-radius: 50%; content: ""; inset: 29%; position: absolute; }
      @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    </style>
  </head>
  <body>
    <main>
      <section class="keybox" id="keybox" aria-label="Digicode">
        <div class="brand" aria-hidden="true"></div>
        <output class="display" id="display" aria-live="polite">------</output>
        <div class="keypad" id="keypad">
          <button class="key" type="button" data-key="1">1</button><button class="key" type="button" data-key="2">2</button><button class="key" type="button" data-key="3">3</button>
          <button class="key" type="button" data-key="4">4</button><button class="key" type="button" data-key="5">5</button><button class="key" type="button" data-key="6">6</button>
          <button class="key" type="button" data-key="7">7</button><button class="key" type="button" data-key="8">8</button><button class="key" type="button" data-key="9">9</button>
          <button class="key key--symbol" type="button" data-key="*">*</button><button class="key" type="button" data-key="0">0</button><button class="key key--symbol" type="button" data-key="#">#</button>
          <button class="key key--clear" type="button" data-clear="true">C</button>
        </div>
      </section>
      <section class="success" id="success" aria-live="polite"><span class="success__label">UNLOCK</span><strong class="success__code" id="unlockCode"></strong></section>
      <a class="return-link" href="console-d-orientation.html"><span class="return-gear" aria-hidden="true"></span>Retour</a>
    </main>
    <script>
      const correctCode = "519223";
      const display = document.querySelector("#display");
      const keypad = document.querySelector("#keypad");
      const keybox = document.querySelector("#keybox");
      const success = document.querySelector("#success");
      const unlockCode = document.querySelector("#unlockCode");
      const parameters = new URLSearchParams(window.location.search);
      const fragmentParameters = new URLSearchParams(window.location.hash.slice(1));
      const rawCode = fragmentParameters.get("code") ?? parameters.get("code");
      let enteredCode = "";

      if (/^-?\d{1,9}$/.test(rawCode ?? "")) {
        unlockCode.textContent = String(Number.parseInt(rawCode, 10) ^ 7319);
      }

      function render() {
        display.textContent = enteredCode.padEnd(6, "-");
      }

      function playSound(type) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const context = new AudioContext();
        const gain = context.createGain();
        gain.connect(context.destination);

        if (type === "error") {
          const oscillator = context.createOscillator();
          oscillator.type = "square";
          oscillator.frequency.setValueAtTime(135, context.currentTime);
          oscillator.frequency.linearRampToValueAtTime(92, context.currentTime + .24);
          gain.gain.setValueAtTime(.08, context.currentTime);
          gain.gain.exponentialRampToValueAtTime(.001, context.currentTime + .28);
          oscillator.connect(gain);
          oscillator.start();
          oscillator.stop(context.currentTime + .28);
          window.setTimeout(() => context.close(), 330);
          return;
        }

        if (type === "success") {
          gain.gain.setValueAtTime(.09, context.currentTime);
          gain.gain.exponentialRampToValueAtTime(.001, context.currentTime + .7);
          [880, 1320].forEach((frequency, index) => {
            const oscillator = context.createOscillator();
            oscillator.type = "sine";
            oscillator.frequency.value = frequency;
            oscillator.connect(gain);
            oscillator.start(context.currentTime + index * .12);
            oscillator.stop(context.currentTime + .68);
          });
          window.setTimeout(() => context.close(), 750);
          return;
        }

        const buffer = context.createBuffer(1, context.sampleRate * .18, context.sampleRate);
        const noise = buffer.getChannelData(0);
        for (let index = 0; index < noise.length; index += 1) noise[index] = Math.random() * 2 - 1;
        const source = context.createBufferSource();
        const filter = context.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.setValueAtTime(550, context.currentTime);
        filter.frequency.exponentialRampToValueAtTime(2600, context.currentTime + .16);
        filter.Q.value = .7;
        gain.gain.setValueAtTime(.035, context.currentTime);
        gain.gain.exponentialRampToValueAtTime(.001, context.currentTime + .18);
        source.buffer = buffer;
        source.connect(filter).connect(gain);
        source.start();
        window.setTimeout(() => context.close(), 240);
      }

      function deny() {
        playSound("error");
        keybox.classList.remove("error");
        window.requestAnimationFrame(() => keybox.classList.add("error"));
        window.setTimeout(() => { enteredCode = ""; render(); }, 420);
      }

      function unlock() {
        playSound("success");
        keybox.hidden = true;
        success.classList.add("visible");
      }

      keypad.addEventListener("click", (event) => {
        const key = event.target.closest("button");
        if (!key) return;
        if (key.dataset.clear) {
          playSound("clear");
          enteredCode = "";
          render();
          return;
        }
        if (!/\d/.test(key.dataset.key) || enteredCode.length === 6) return;
        enteredCode += key.dataset.key;
        render();
        if (enteredCode.length === 6) {
          if (enteredCode === correctCode) unlock();
          else deny();
        }
      });
    </script>
  </body>
</html>
