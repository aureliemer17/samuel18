<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23141d18'/%3E%3Ccircle cx='32' cy='32' r='20' fill='%236f9d61'/%3E%3Ccircle cx='32' cy='32' r='8' fill='%23141d18'/%3E%3C/svg%3E" />
    <title>Console</title>
    <style>
      :root { --deep: #063317; --machine: #087a35; --green: #0aa34c; --acid: #efffe5; --brass: #d9e8c6; --ink: #062614; }
      * { box-sizing: border-box; }
      body { align-items: center; background: radial-gradient(circle at 50% 42%, rgba(19, 108, 49, .24), transparent 34%), repeating-radial-gradient(ellipse at 15% 22%, rgba(255, 255, 255, .025) 0 1px, transparent 2px 5px), linear-gradient(135deg, #011208, #022b12 50%, #011b0c); display: flex; justify-content: center; margin: 0; min-height: 100vh; padding: 18px; }
      main { width: min(100%, 820px); }
      .instruction { color: #f5ffe9; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: clamp(.8rem, 2.4vw, 1.1rem); font-weight: 900; letter-spacing: .14em; margin: 0 0 13px; text-align: center; text-shadow: 0 2px 3px rgba(0, 57, 23, .8); text-transform: uppercase; }
      .console { background: linear-gradient(145deg, #12b756, #07843b 43%, #046127); border: 7px solid #f4ffe9; border-radius: 28px; box-shadow: 0 24px 45px rgba(0, 44, 18, .52), inset 0 2px 1px rgba(255, 255, 255, .35), inset 0 -10px 18px #035b26, 0 0 0 5px #006122; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(155px, .85fr); gap: clamp(15px, 5vw, 45px); padding: clamp(20px, 5vw, 45px); position: relative; width: 100%; }
      .console::before { background-image: radial-gradient(rgba(255, 255, 255, .15) 1px, transparent 1px); background-size: 7px 7px; border-radius: inherit; content: ""; inset: 0; pointer-events: none; position: absolute; }
      .mechanism { align-items: center; display: flex; justify-content: center; min-width: 0; position: relative; }
      .gear { aspect-ratio: 1; background: #f7fff0; clip-path: polygon(50% 0%, 56% 6%, 65% 2%, 69% 10%, 79% 9%, 80% 18%, 90% 22%, 86% 31%, 97% 38%, 90% 46%, 100% 54%, 90% 60%, 96% 71%, 86% 73%, 88% 84%, 78% 83%, 74% 94%, 65% 89%, 57% 100%, 50% 91%, 42% 100%, 35% 89%, 26% 94%, 22% 83%, 12% 84%, 14% 73%, 4% 71%, 10% 60%, 0% 54%, 10% 46%, 3% 38%, 14% 31%, 10% 22%, 20% 18%, 21% 9%, 31% 10%, 35% 2%, 44% 6%); filter: drop-shadow(0 8px 3px rgba(0, 52, 19, .6)); max-width: 260px; position: relative; width: 100%; }
      .gear::before { background: #0a963f; border: clamp(10px, 4vw, 22px) solid #f7fff0; border-radius: 50%; box-shadow: inset 0 0 15px #006629; content: ""; inset: 16%; position: absolute; }
      .gear::after { background: #f7fff0; border: 5px solid #0a963f; border-radius: 50%; box-shadow: 0 0 0 3px #f7fff0; content: ""; inset: 36%; position: absolute; }
      .panel { background: linear-gradient(145deg, #06441e, #012c12); border: 4px solid #b3e59d; box-shadow: inset 0 0 0 2px #087438, 5px 7px 0 rgba(0, 20, 7, .42); min-width: 0; padding: 14px; position: relative; }
      .screen { align-items: center; background: #07120b; border: 3px solid #060a07; box-shadow: inset 0 0 12px #000, 0 0 0 1px #789265; color: var(--acid); display: flex; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: clamp(1rem, 4vw, 1.6rem); height: 49px; justify-content: center; letter-spacing: .3em; margin-bottom: 14px; padding-left: .3em; text-shadow: 0 0 8px #d5e883; }
      .keypad { display: grid; gap: 7px; grid-template-columns: repeat(3, 1fr); }
      .key { appearance: none; background: linear-gradient(145deg, #168b45, #075a29 55%, #023918); border: 2px solid #001d0b; box-shadow: inset 0 1px 1px rgba(180, 255, 187, .28), 0 3px 0 #001b09; color: #f2ffe9; cursor: pointer; font-family: ui-monospace, monospace; font-size: 1.05rem; font-weight: 900; min-height: 37px; padding: 0; text-shadow: 0 1px #013617; transition: transform .06s, box-shadow .06s; }
      .key:active { box-shadow: inset 0 2px 5px #182519, 0 1px 0 #070b08; transform: translateY(2px); }
      .key--clear { color: #f4bb98; }
      .key--enter { background: linear-gradient(145deg, #d6d982, #758b46 55%, #4d6439); color: #111a11; grid-column: span 2; }
      .home-link { color: #e4edc6; display: block; font-family: Arial, sans-serif; font-size: .72rem; font-weight: 900; letter-spacing: .1em; margin-top: 18px; text-align: center; text-decoration: none; text-transform: uppercase; }
      .home-link:hover { color: #d5e883; }
      .error { animation: shake .28s linear; }
      @keyframes rotate { to { transform: rotate(360deg); } }
      @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
      @media (max-width: 700px) { body { align-items: flex-start; padding: 10px 10px 28px; } .console { gap: 18px; grid-template-columns: 1fr; padding: 14px; } .panel { order: 1; padding: 12px; width: 100%; } .mechanism { order: 2; } .gear { max-width: 130px; } .keypad { gap: 9px; width: 100%; } .key { font-size: 1.2rem; min-height: 50px; } }
    </style>
  </head>
  <body>
    <main>
      <p class="instruction">Selectionner une machine</p>
      <section class="console">
        <div class="mechanism" aria-hidden="true"><div class="gear"></div></div>
        <section class="panel" aria-label="Console de navigation">
          <output class="screen" id="screen" aria-live="polite"></output>
          <div class="keypad" id="keypad">
            <button class="key" type="button" data-key="1">1</button><button class="key" type="button" data-key="2">2</button><button class="key" type="button" data-key="3">3</button>
            <button class="key" type="button" data-key="4">4</button><button class="key" type="button" data-key="5">5</button><button class="key" type="button" data-key="6">6</button>
            <button class="key" type="button" data-key="7">7</button><button class="key" type="button" data-key="8">8</button><button class="key" type="button" data-key="9">9</button>
            <button class="key key--clear" type="button" data-clear="true">C</button><button class="key" type="button" data-key="0">0</button><button class="key key--enter" type="button" data-enter="true">OK</button>
          </div>
        </section>
      </section>
      <a class="home-link" href="../index.html">Retour à l'accueil</a>
    </main>
    <script src="../config/config.js"></script>
    <script>
      const destinations = window.PUZZLE_CONFIG.machines;
      const screen = document.querySelector("#screen");
      const keypad = document.querySelector("#keypad");
      const panel = document.querySelector(".panel");
      let code = "";

      function render() {
        screen.textContent = code;
      }

      function reject() {
        panel.classList.remove("error");
        window.requestAnimationFrame(() => panel.classList.add("error"));
        code = "";
        window.setTimeout(render, 280);
      }

      function submit() {
        const destination = destinations[code];
        if (destination) window.location.assign(destination);
        else reject();
      }

      keypad.addEventListener("click", (event) => {
        const key = event.target.closest("button");
        if (!key) return;
        if (key.dataset.clear) { code = ""; render(); return; }
        if (key.dataset.enter) { submit(); return; }
        if (code.length < 4) { code += key.dataset.key; render(); }
      });
    </script>
  </body>
</html>
