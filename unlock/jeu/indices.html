<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#315e76" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <style>html { touch-action: manipulation; }</style>
    <title>Service des indices — Affaire S-18</title>
    <style>
:root{--ink:#203c4b;--blue:#315e76;--deep:#17394b;--gold:#bda477;--paper:#f7f3e8;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:22px 16px;color:var(--ink);font-family:Georgia,serif;background:linear-gradient(#e8eef0b8,#d4e0e6c9),url('../assets/index_background.png') center/cover fixed}main{width:min(100%,460px)}.heading{text-align:center;margin:0 0 18px}.heading img{width:72px;height:72px;object-fit:contain;filter:drop-shadow(3px 4px 4px #17394b33)}.eyebrow,.plate,.screen-label,.modal__eyebrow,.footer{font:700 .72rem/1.5 var(--mono);letter-spacing:.13em;text-transform:uppercase}.heading h1{font-size:clamp(2rem,7vw,2.8rem);margin:5px 0;line-height:1.05}.heading p{margin:8px 0;font-size:.98rem}.console{position:relative;padding:20px clamp(18px,5vw,32px) 25px;background:linear-gradient(145deg,#62879a,#345d74 48%,#23475c);border:2px solid #203e50;border-radius:18px;box-shadow:inset 0 0 0 3px #a8bfca55,7px 8px 15px #17394b40;color:#f5f0df}.console:before,.console:after{content:'−';position:absolute;top:12px;width:14px;height:14px;border-radius:50%;background:linear-gradient(145deg,#ead7ad,#9d8357);color:#584b35;text-align:center;font:bold 13px/14px var(--mono);box-shadow:1px 2px 2px #152d3e88}.console:before{left:12px}.console:after{right:12px}.plate{text-align:center;color:#f4e1b8;margin:0 0 17px}.screen-label{display:block;margin:0 0 6px;color:#e0ebed}.screen{display:grid;place-items:center;min-height:65px;background:#142d39;border:3px solid #a2b5bb;border-radius:7px;box-shadow:inset 2px 3px 9px #091a24;color:#d8f4ff;font:700 clamp(1.5rem,7vw,2.2rem) var(--mono);letter-spacing:.16em;margin-bottom:17px}.screen:empty:before{content:'— —';opacity:.45}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.key{cursor:pointer;min-height:52px;border:1px solid #17394b;border-radius:8px;background:linear-gradient(145deg,#f2f6f7,#a9c1ce);color:#18394d;font:700 1.35rem var(--mono);box-shadow:inset 1px 1px 2px #fff,3px 4px 0 #17394b,4px 5px 7px #122c4050;transition:transform .1s,box-shadow .1s}.key:active{transform:translate(2px,3px);box-shadow:inset 1px 2px 5px #17394b55,1px 1px 0 #17394b}.key--clear{color:#8c3e38}.key--enter{background:linear-gradient(145deg,#d9c49a,#b49a65);color:#253b43;font-size:1rem}.home-link{display:flex;align-items:center;justify-content:center;width:fit-content;max-width:100%;min-height:48px;text-align:center;margin:24px auto 14px;padding:12px 24px;color:#263c48;font:700 .85rem var(--mono);letter-spacing:.06em;text-transform:uppercase;text-decoration:none;background:linear-gradient(145deg,#fff1cb,#d9bf86 55%,#b89a60);border:2px solid #94723e;border-radius:12px;box-shadow:inset 0 0 0 2px #f9e9bd,inset 1px 2px 3px #fff8e5,3px 4px 0 #795d37,5px 6px 9px #17394b35;transition:transform .12s,box-shadow .12s,background .12s}.home-link:hover{background:linear-gradient(145deg,#fff8df,#e8cf98 55%,#c5a66c)}.home-link:active{transform:translate(2px,3px);box-shadow:inset 1px 2px 4px #94723e55,1px 1px 0 #795d37}.footer{text-align:center;color:#405c69;font-size:.63rem}.modal{position:fixed;inset:0;background:#102c3d99;backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;z-index:10}.modal[hidden],.solution-confirm[hidden]{display:none}.modal__card{position:relative;width:min(100%,580px);max-height:90vh;overflow:auto;padding:30px clamp(20px,5vw,36px);background:repeating-linear-gradient(0deg,transparent 0 27px,#315e7608 28px 29px),var(--paper);border:1px solid #9aafba;border-top:8px solid var(--blue);border-radius:10px;box-shadow:6px 8px 25px #102c3d55}.close{position:absolute;right:14px;top:12px;width:40px;height:40px;border:1px solid #a8bcc7;border-radius:50%;background:#e3ebee;color:var(--deep);font-size:1.5rem;cursor:pointer}.modal__eyebrow{color:var(--blue);margin:0 45px 10px 0}.modal h1{font-size:2rem;margin:0 35px 18px 0}.hint-text{white-space:pre-wrap;overflow-wrap:anywhere;background:#fffdf7;border-left:4px solid var(--blue);padding:18px;min-height:110px;font-size:1.15rem;line-height:1.6}.hint-tabs{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.hint-tab{cursor:pointer;border:1px solid #8da9b9;border-radius:6px;min-height:44px;min-width:44px;padding:8px 12px;background:#dce8ee;color:var(--deep);font:700 .85rem var(--mono)}.hint-tab.active{background:var(--blue);color:white;outline:2px solid var(--gold);outline-offset:2px}.hint-tab.solution{background:#91483d;color:white;border-color:#91483d;margin-inline-start:auto;position:relative}.hint-tab.solution::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;border-left:1px solid #bda477;pointer-events:none}.hint-tabs{column-gap:20px}.solution-confirm{position:absolute;inset:0;background:#17394b99;display:grid;place-items:center;padding:14px}.solution-confirm__card{background:var(--paper);border:2px solid var(--gold);border-radius:10px;padding:20px;text-align:center;width:min(100%,420px)}.solution-confirm__card h2{margin:0;color:#91483d}.solution-confirm__card p{line-height:1.5}.solution-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.solution-actions button{cursor:pointer;border:0;border-radius:6px;padding:12px;font:700 .9rem Georgia,serif}.solution-actions__cancel{background:#dce8ee;color:var(--deep)}.solution-actions__continue{background:#91483d;color:white}button:focus-visible,a:focus-visible{outline:3px solid #d49d45;outline-offset:3px}@media(max-width:600px){body{background-image:linear-gradient(#e8eef0b8,#d4e0e6c9),url('../assets/index_background_mobile.png');background-attachment:scroll}.heading img{width:60px;height:60px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}


/* Console compacte sur ordinateur et tablette */
@media (min-width:601px){
 body{padding:14px 16px}
 main{width:min(100%,390px)}
 .heading{margin-bottom:12px}
 .heading img{width:58px;height:58px}
 .heading h1{font-size:2.25rem}
 .console{padding:16px 24px 19px}
 .plate{margin-bottom:12px}
 .screen{min-height:54px;margin-bottom:12px}
 .keypad{gap:8px}
 .key{min-height:44px;font-size:1.2rem}
 .key--enter{font-size:1rem}
 .home-link{margin:17px auto 10px}
}
@media (min-width:601px) and (max-height:720px){
 body{padding:8px 12px}
 .heading img{width:46px;height:46px}
 .heading h1{font-size:1.85rem}
 .heading p{margin:5px 0}
 .heading{margin-bottom:8px}
 .console{padding:12px 22px 15px}
 .plate{margin-bottom:8px}
 .screen{min-height:46px;margin-bottom:10px}
 .keypad{gap:7px}
 .key{min-height:40px}
 .home-link{min-height:40px;margin:12px auto 8px;padding:8px 18px}
}
</style>
  </head>
  <body>
    <main>
      <header class="heading"><img src="../assets/indice.png" alt=""/><div class="eyebrow">Bureau de la Majorité · S-18</div><h1>Service des indices</h1><p>Besoin d’un coup de pouce, agents ?</p></header>
      <section class="console" aria-label="Digicode des indices">
        <p class="plate">Terminal de consultation</p><label class="screen-label" for="screen">Numéro de la carte</label><output class="screen" id="screen" aria-live="polite"></output>
        <div class="keypad" id="keypad">
          <button class="key" type="button" data-key="1">1</button><button class="key" type="button" data-key="2">2</button><button class="key" type="button" data-key="3">3</button>
          <button class="key" type="button" data-key="4">4</button><button class="key" type="button" data-key="5">5</button><button class="key" type="button" data-key="6">6</button>
          <button class="key" type="button" data-key="7">7</button><button class="key" type="button" data-key="8">8</button><button class="key" type="button" data-key="9">9</button>
          <button class="key key--clear" type="button" data-clear="true">C</button><button class="key" type="button" data-key="0">0</button><button class="key key--enter" type="button" data-enter="true">OK</button>
        </div>
      </section>
      <a class="home-link" href="../index.html">← Retour à l'accueil</a><p class="footer">Affaire S-18 · Assistance aux agences</p>
    </main>
    <section class="modal" id="modal" hidden aria-modal="true" role="dialog">
       <div class="modal__card"><button class="close" id="close" type="button" aria-label="Fermer">×</button><p class="modal__eyebrow" id="modalLabel"></p><h1 id="modalTitle"></h1><div class="hint-text" id="hintText"></div><div class="hint-tabs" id="hintTabs"></div><section class="solution-confirm" id="solutionConfirm" hidden><div class="solution-confirm__card"><h2>Attention</h2><p>Cela va donner la solution. Êtes-vous sûrs de vouloir continuer ?</p><div class="solution-actions"><button class="solution-actions__cancel" id="solutionCancel" type="button">Non, je veux réfléchir encore</button><button class="solution-actions__continue" id="solutionContinue" type="button">Continuer</button></div></div></section></div>
    </section>
    <script src="../config/hints-config.js"></script>
    <script>
      const screen = document.querySelector("#screen");
      const keypad = document.querySelector("#keypad");
      const consoleElement = document.querySelector(".console");
      const modal = document.querySelector("#modal");
      const close = document.querySelector("#close");
      const modalLabel = document.querySelector("#modalLabel");
      const modalTitle = document.querySelector("#modalTitle");
       const hintText = document.querySelector("#hintText");
       const hintTabs = document.querySelector("#hintTabs");
       const solutionConfirm = document.querySelector("#solutionConfirm");
       const solutionCancel = document.querySelector("#solutionCancel");
       const solutionContinue = document.querySelector("#solutionContinue");
       const hints = window.HINTS_CONFIG;
       let cardNumber = "";
       let pendingSolution;

      function render() { screen.textContent = cardNumber; }
       function closeModal() { modal.hidden = true; solutionConfirm.hidden = true; cardNumber = ""; render(); }
       function showHint(number, config, index = 0) {
         const list = config.hints || [];
         modalLabel.textContent = `INDICE "${number}"`;
         modalTitle.textContent = list.length ? (config.solution === index + 1 ? "Solution" : `Indice ${index + 1}`) : "Rien à signaler";
         hintText.textContent = list.length ? list[index] : `Il n'y a pas d'indice pour la carte sélectionnée.`;
         hintTabs.replaceChildren();
         list.forEach((item, tabIndex) => {
           const tabIsSolution = config.solution === tabIndex + 1;
           const tab = document.createElement("button");
           tab.className = `hint-tab${tabIndex === index ? " active" : ""}${tabIsSolution ? " solution" : ""}`;
           tab.type = "button";
           tab.textContent = tabIsSolution ? "Solution" : `Indice ${tabIndex + 1}`;
           if (tabIsSolution) {
             tab.addEventListener("click", () => { pendingSolution = () => showHint(number, config, tabIndex); solutionConfirm.hidden = false; });
             hintTabs.append(tab);
             return;
           }
           tab.addEventListener("click", () => showHint(number, config, tabIndex));
           hintTabs.append(tab);
         });
        modal.hidden = false;
      }
       function submit() {
         if (!hints) { showHint(cardNumber, { hints: ["Le fichier de configuration des indices est indisponible."] }); return; }
         const config = hints[cardNumber] || { hints: [] };
         if (config.solution === 1 && config.hints?.length) {
           modalLabel.textContent = `INDICE "${cardNumber}"`;
           modalTitle.textContent = "Solution disponible";
           hintText.textContent = "La réponse est protégée.";
           hintTabs.replaceChildren(); modal.hidden = false;
           pendingSolution = () => showHint(cardNumber, config); solutionConfirm.hidden = false;
         } else showHint(cardNumber, config);
       }
      keypad.addEventListener("click", (event) => {
        const key = event.target.closest("button");
        if (!key) return;
        if (key.dataset.clear) { cardNumber = ""; render(); return; }
        if (key.dataset.enter) { if (cardNumber) submit(); return; }
        if (cardNumber.length < 8) { cardNumber += key.dataset.key; render(); }
      });
       close.addEventListener("click", closeModal);
       modal.addEventListener("click", (event) => { if (event.target === modal) closeModal(); });
       solutionCancel.addEventListener("click", () => { solutionConfirm.hidden = true; pendingSolution = undefined; });
       solutionContinue.addEventListener("click", () => { solutionConfirm.hidden = true; pendingSolution?.(); pendingSolution = undefined; });
    </script>
  </body>
</html>
