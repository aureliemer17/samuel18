<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#102218" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <title>Ordinateur des énigmes — Affaire S-18</title>
    <style>
      :root { --case:#d9cfb5; --case-dark:#9b947f; --green:#a8f78d; --screen:#07140d; --line:#3d6044; --ink:#d9f8cf; --mono:ui-monospace, SFMono-Regular, Menlo, monospace; }
      * { box-sizing:border-box; }
      body { align-items:center; background:radial-gradient(circle at 50% 0,#413628,#160f0b 70%); color:var(--ink); display:flex; font-family:var(--mono); margin:0; min-height:100vh; min-height:100svh; padding:18px; }
      main { margin:auto; max-width:900px; width:100%; }
      .computer { background:linear-gradient(145deg,#eee5cc,#bbb19a 64%,#928b78); border:8px solid var(--case-dark); border-radius:20px 20px 28px 28px; box-shadow:inset 0 0 0 3px #fff8df,0 26px 55px #000a; padding:clamp(15px,4vw,35px); position:relative; }
      .badge { color:#564d3e; font-size:.66rem; font-weight:900; letter-spacing:.16em; margin:0 0 10px; text-align:center; text-transform:uppercase; }
      .screen-shell { background:#22291f; border:11px solid #554f40; border-radius:14px; box-shadow:inset 0 0 0 3px #aca184,0 6px 0 #746c5a; padding:clamp(12px,3vw,24px); }
      .screen { background:repeating-linear-gradient(0deg,#09180e 0 2px,#07130b 2px 5px); border:2px solid #182c1c; box-shadow:inset 0 0 28px #00b34335; min-height:440px; overflow:auto; padding:clamp(16px,4vw,35px); text-shadow:0 0 7px #86e97766; }
      .screen.off { background:#061008; box-shadow:inset 0 0 25px #000; color:transparent; }
      .power { background:#4a3d30; border:3px solid #817663; border-radius:50%; bottom:17px; box-shadow:inset 0 0 0 3px #252017,0 2px 0 #fff7; color:#f5e4b4; cursor:pointer; height:31px; position:absolute; right:22px; width:31px; }
      .power.on { background:#6da54e; box-shadow:inset 0 0 0 3px #26421e,0 0 10px #92ef67; }
      .boot { animation:boot .65s steps(3,end); color:var(--green); } @keyframes boot { from { opacity:0; transform:scaleY(.03); } to { opacity:1; transform:none; } }
      h1,h2,h3,p { margin-top:0; } h1 { font-size:clamp(1.25rem,5vw,2.2rem); } h2 { font-size:clamp(1.1rem,4vw,1.55rem); } h3 { font-size:1rem; }
      .terminal-line,.meta { color:#86be79; font-size:.78rem; letter-spacing:.06em; text-transform:uppercase; }
      .login { display:grid; gap:14px; max-width:430px; } input { background:#0a1d10; border:1px solid #6ca464; color:var(--green); font:inherit; padding:12px; width:100%; } button,.button { background:#183621; border:1px solid #92c67d; color:var(--ink); cursor:pointer; font:700 .8rem var(--mono); letter-spacing:.05em; padding:11px 13px; text-decoration:none; text-transform:uppercase; } button:hover,.button:hover { background:#285132; } .error { color:#ffb8a3; } .success { color:#baff9f; }
      .desktop-header { align-items:center; border-bottom:1px solid var(--line); display:flex; gap:12px; justify-content:space-between; margin-bottom:22px; padding-bottom:12px; } .desktop-header h1 { margin:0; }
      .stats { color:#b7d8a9; font-size:.76rem; } .categories,.puzzle-list { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(175px,1fr)); }
      .category,.puzzle { background:#0b1e10cc; border:1px solid #48704b; color:inherit; min-height:115px; padding:15px; text-align:left; } .category.done,.puzzle.done { border-color:#a9e582; } .category-icon { font-size:2rem; } .count { color:#a8cc93; display:block; font-size:.75rem; margin-top:10px; }
      .back { margin-bottom:18px; } .puzzle-card { background:#0a1a0eaa; border:1px solid #527756; max-width:650px; padding:20px; } .puzzle-card p { line-height:1.6; white-space:pre-wrap; } .puzzle-assets { display:grid; gap:12px; margin:18px 0; } .puzzle-assets img { background:#eef0e6; border:1px solid #78906f; display:block; height:auto; max-width:100%; padding:8px; } .response-format { color:#b7d8a9; font-size:.78rem; } .archive-codes { display:flex; flex-wrap:wrap; gap:8px; margin:14px 0; } .archive-codes a { color:#c9ffad; }
      .empty { color:#aac5a0; max-width:520px; line-height:1.65; } .home-link { display:block; margin:16px auto 0; text-align:center; width:max-content; } .footer { color:#665e4d; font-size:.67rem; margin-top:14px; text-align:center; }
      @media (max-width:600px) { body { padding:8px; } .computer { border-width:6px; border-radius:14px; padding:12px; } .screen-shell { border-width:7px; padding:9px; } .screen { min-height:calc(100svh - 95px); padding:18px; } .desktop-header { align-items:flex-start; flex-direction:column; } .categories,.puzzle-list { grid-template-columns:1fr; } }
      @media (prefers-reduced-motion:reduce) { * { animation:none !important; } }
    </style>
  </head>
  <body>
    <main>
      <section class="computer" aria-label="Ordinateur des énigmes">
        <p class="badge">Terminal administratif M-46</p>
        <div class="screen-shell"><div class="screen off" id="screen" aria-live="polite"></div></div>
        <button class="power" id="power" type="button" aria-label="Marche / arrêt"></button>
      </section>
      <a class="button home-link" href="../index.html">← Retour à l’accueil</a>
      <p class="footer">AFFAIRE S-18 · ORDINATEUR DES ÉNIGMES</p>
    </main>
    <script src="../config/ordinateur-catalog.js"></script>
    <script src="../config/ordinateur-progress.js"></script>
    <script>
      const catalog = window.ORDINATEUR_CATALOG;
      const progress = window.ORDINATEUR_PROGRESS;
      const screen = document.querySelector("#screen");
      const power = document.querySelector("#power");
      const normalize = (value) => value.trim().toLocaleLowerCase("fr");
      const activePuzzles = () => catalog.puzzles.filter((puzzle) => puzzle.enabled && puzzle.admin?.published);
      const categories = () => [...catalog.categories].sort((a, b) => a.order - b.order);
      const solved = () => progress.read().puzzles;
      const stats = (categoryId) => {
        const puzzles = activePuzzles().filter((puzzle) => !categoryId || puzzle.categoryId === categoryId);
        const solvedCount = puzzles.filter((puzzle) => solved()[puzzle.id]?.solved).length;
        return { total:puzzles.length, solved:solvedCount, remaining:puzzles.length - solvedCount };
      };
      const categoryTitle = (id) => categories().find((category) => category.id === id)?.title || id;
      function renderLogin(message = "") {
        progress.setView({ name: "login" });
        screen.innerHTML = `<div class="boot"><p class="terminal-line">S-18 / TERMINAL 46 / ACCÈS RESTREINT</p><h1>LOGIN</h1><form class="login" id="loginForm"><label>Identifiant<input id="login" autocomplete="username" autofocus /></label><button>Ouvrir la session</button><p class="error">${message}</p></form></div>`;
        screen.querySelector("#loginForm").addEventListener("submit", (event) => { event.preventDefault(); if (normalize(screen.querySelector("#login").value) === "delorme") { progress.authenticate(); renderDesktop(); } else renderLogin("Identifiant non reconnu."); });
      }
      function renderDesktop() {
        progress.setView({ name: "desktop" });
        const total = stats();
        screen.innerHTML = `<div class="boot"><header class="desktop-header"><div><p class="terminal-line">Session DELORME · terminal 46</p><h1>Bureau des énigmes</h1></div><p class="stats">${total.solved} résolue(s) · ${total.remaining} restante(s) · ${total.total} accessible(s)</p></header><section class="categories" id="categories"></section></div>`;
        const container = screen.querySelector("#categories");
        if (!categories().length) { container.innerHTML = `<p class="empty">Aucune catégorie publiée pour le moment. Le catalogue peut être complété sans modifier cette interface.</p>`; return; }
        categories().forEach((category) => { const count = stats(category.id); const button = document.createElement("button"); button.className = `category${count.total > 0 && count.remaining === 0 ? " done" : ""}`; button.innerHTML = `<span class="category-icon">${category.icon || "▣"}</span><h2>${category.title}</h2><span class="count">${count.solved} / ${count.total} résolue(s)</span>`; button.addEventListener("click", () => category.id === "sudoku" ? window.location.assign(`../ordinateur/sudoku/index.html?from=ordinateur`) : renderCategory(category.id)); container.append(button); });
      }
      function renderCategory(categoryId) {
        progress.setView({ name: "category", categoryId });
        const puzzles = activePuzzles().filter((puzzle) => puzzle.categoryId === categoryId).sort((a, b) => a.order - b.order);
        screen.innerHTML = `<button class="back" id="back">← Bureau</button><p class="terminal-line">Catégorie</p><h1>${categoryTitle(categoryId)}</h1><section class="puzzle-list" id="puzzles"></section>`;
        screen.querySelector("#back").addEventListener("click", renderDesktop);
        const container = screen.querySelector("#puzzles");
        if (!puzzles.length) { container.innerHTML = `<p class="empty">Aucune énigme accessible dans cette catégorie.</p>`; return; }
        puzzles.forEach((puzzle) => { const result = solved()[puzzle.id]; const button = document.createElement("button"); button.className = `puzzle${result?.solved ? " done" : ""}`; button.innerHTML = `<span class="terminal-line">${result?.solved ? "Résolue" : "À résoudre"}</span><h2>${puzzle.title}</h2><span class="count">${result?.solved ? result.archiveCodes.join(" · ") : "Ouvrir l’énigme"}</span>`; button.addEventListener("click", () => puzzle.template === "sudoku" ? window.location.assign(`../ordinateur/sudoku/sudoku.html?id=${encodeURIComponent(puzzle.id)}&from=ordinateur`) : renderPuzzle(puzzle.id)); container.append(button); });
      }
      function renderPuzzle(id, message = "") {
        const puzzle = activePuzzles().find((entry) => entry.id === id);
        if (!puzzle) return renderDesktop();
        progress.setView({ name: "puzzle", puzzleId: id });
        const result = solved()[id];
        const archiveLinks = (codes) => `<div class="archive-codes">${codes.map((code) => `<a class="button" href="../archives/media.html#code=${encodeURIComponent(code)}&from=ordinateur">Archive ${code}</a>`).join("")}</div>`;
        const assets = (puzzle.assets || []).map((source, index) => `<img src="${source}" alt="Support visuel ${index + 1} de l’énigme : ${puzzle.title}" />`).join("");
        const responseFormat = puzzle.responseFormat ? `<p class="response-format">Format attendu : ${puzzle.responseFormat}</p>` : "";
        screen.innerHTML = `<button class="back" id="back">← ${categoryTitle(puzzle.categoryId)}</button><article class="puzzle-card"><p class="terminal-line">Énigme ${puzzle.id}</p><h1>${puzzle.title}</h1><p>${puzzle.instructions}</p>${assets ? `<div class="puzzle-assets">${assets}</div>` : ""}${responseFormat}${result?.solved ? `<p class="success">Résolue. Réponse enregistrée : ${result.submittedAnswer}</p>${archiveLinks(result.archiveCodes)}<button id="continue">Continuer les énigmes</button>` : `<form class="login" id="answerForm"><label>Votre réponse<input id="answer" autocomplete="off" autofocus /></label><button>Valider</button><p class="error">${message}</p></form>`}</article>`;
        screen.querySelector("#back").addEventListener("click", () => renderCategory(puzzle.categoryId));
        if (result?.solved) { screen.querySelector("#continue").addEventListener("click", () => renderCategory(puzzle.categoryId)); return; }
        screen.querySelector("#answerForm").addEventListener("submit", (event) => { event.preventDefault(); const answer = screen.querySelector("#answer").value; const accepted = puzzle.acceptedAnswers.some((candidate) => normalize(candidate) === normalize(answer)); if (!accepted) return renderPuzzle(id, "Réponse incorrecte. Réessayez."); progress.solve(id, answer.trim(), puzzle.archiveCodes); renderPuzzle(id); });
      }
      function restoreView() {
        const { view } = progress.read();
        if (!progress.read().authenticated) return renderLogin();
        if (view?.name === "category" && categories().some((category) => category.id === view.categoryId)) return renderCategory(view.categoryId);
        if (view?.name === "puzzle" && activePuzzles().some((puzzle) => puzzle.id === view.puzzleId)) return renderPuzzle(view.puzzleId);
        return renderDesktop();
      }
      function boot(restored = false) { progress.discover(); progress.setPoweredOn(true); power.classList.add("on"); screen.classList.remove("off"); if (restored) return restoreView(); screen.innerHTML = `<p class="boot terminal-line">Initialisation du terminal…</p>`; window.setTimeout(restoreView, 650); }
      function shutdown() { progress.setPoweredOn(false); power.classList.remove("on"); screen.className = "screen off"; screen.replaceChildren(); }
      power.addEventListener("click", () => { if (power.classList.contains("on")) shutdown(); else boot(); });
      if (new URLSearchParams(location.search).get("direct") === "1" && progress.read().authenticated) boot(true);
      else if (progress.read().poweredOn) boot(true);
    </script>
  </body>
</html>
