<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b1730" />
    <title>Entre les lignes — Affaire S-18</title>
    <link rel="stylesheet" href="ligne.css?v=20261127-1" />
  </head>
  <body>
    <main>
      <a class="back" id="back">← Accueil</a>
      <p class="eyebrow">Affaire S-18 / Ordinateur des énigmes</p>
      <h1>Entre les lignes</h1>
      <p id="stats"></p>
      <section class="catalog" id="catalog" aria-live="polite"></section>
    </main>
    <script src="../../config/ordinateur-catalog.js?v=ligne-20261127"></script>
    <script src="../../config/ordinateur-progress.js?v=ligne-20261127"></script>
    <script src="../common/catalog.js"></script>
    <script>
      const fromComputer = new URLSearchParams(location.search).get("from") === "ordinateur";
      const puzzles = window.ORDINATEUR_COMMON.activePuzzles().filter((puzzle) => puzzle.template === "ligne").sort((a, b) => a.order - b.order);
      const progress = window.ORDINATEUR_PROGRESS;
      const status = (puzzle) => progress.ligne(puzzle.id).status;
      const back = document.querySelector("#back");
      back.href = fromComputer ? "../../jeu/ordinateur.html" : "../../index.html";
      back.textContent = fromComputer ? "← Bureau des énigmes" : "← Accueil";
      document.querySelector("#stats").textContent = `${puzzles.filter((puzzle) => status(puzzle) === "solved").length} résolu(s) · ${puzzles.filter((puzzle) => status(puzzle) === "in_progress").length} en cours · ${puzzles.length} accessible(s)`;
      document.querySelector("#catalog").innerHTML = puzzles.map((puzzle) => `<a class="card ${status(puzzle)}" href="ligne.html?id=${encodeURIComponent(puzzle.id)}${fromComputer ? "&from=ordinateur" : ""}"><span>${status(puzzle) === "solved" ? "Résolu" : status(puzzle) === "in_progress" ? "En cours" : "À faire"}</span><strong>${puzzle.title}</strong><small>Expression illustrée</small></a>`).join("") || "<p>Aucune énigme publiée.</p>";
    </script>
  </body>
</html>
